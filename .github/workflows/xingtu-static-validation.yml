name: Xingtu Static Validation (No APK)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install source-patch dependencies
        run: python -m pip install --disable-pip-version-check pyyaml pillow cairosvg

      - name: Run exact pre-APK patch sequence through Stage F
        run: python native-overlay/run_xingtu_static_validation.py

      - name: Upload generated editor and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xingtu-static-validation-no-apk
          path: |
            source/ShiWanJu-Android/app/src/main/java/com/shiwanju/app/ui/ArticleEditorRedesignedScreen.kt
            xingtu_redesign_patch_error.txt
            xingtu_stage_c_patch_error.txt
            xingtu_stage_d_patch_error.txt
            xingtu_stage_e_patch_error.txt
            xingtu_stage_f_patch_error.txt
            xingtu_static_validation_error.txt
          if-no-files-found: ignore
          retention-days: 7
