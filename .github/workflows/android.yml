name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source archive
        id: source
        shell: bash
        run: |
          if [ -f "ShiWanJu-Android-deploy.zip" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "ShiWanJu-Android-deploy.zip is not in the repository yet; skipping the APK build."
          fi

      - name: Set up JDK 17
        if: steps.source.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        if: steps.source.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project and apply repository logo
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          unzip -q ShiWanJu-Android-deploy.zip -d source
          PROJECT="source/ShiWanJu-Android"
          test -f "$PROJECT/app/build.gradle.kts"
          mkdir -p "$PROJECT/app/src/main/res/drawable-nodpi"
          cp IMG_20261017_090019.jpg "$PROJECT/app/src/main/res/drawable-nodpi/app_logo.jpg"
          cp -R native-overlay/app/. "$PROJECT/app/"
          python3 native-overlay/apply_patches.py
          cat > "$PROJECT/app/src/main/res/drawable/ic_launcher_background.xml" <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#56D274" android:pathData="M0,0h108v108h-108z" />
          </vector>
          XML
          cat > "$PROJECT/app/src/main/res/drawable/ic_launcher_foreground.xml" <<'XML'
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android"
              android:src="@drawable/app_logo"
              android:gravity="fill" />
          XML
          # Kotlin property setter and custom method had the same JVM signature.
          sed -i 's/fun setTextViewMode(/fun updateTextViewMode(/' "$PROJECT/app/src/main/java/com/shiwanju/app/ui/AppViewModel.kt"
          sed -i 's/vm.setTextViewMode(/vm.updateTextViewMode(/g' "$PROJECT/app/src/main/java/com/shiwanju/app/ui/MyScreens.kt"

      - name: Build debug APK
        if: steps.source.outputs.present == 'true'
        run: gradle --no-daemon -p source/ShiWanJu-Android :app:assembleDebug

      - name: Upload APK
        if: steps.source.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ShiWanJu-debug-apk
          path: source/ShiWanJu-Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
