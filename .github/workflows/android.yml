name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source archive
        id: source
        shell: bash
        run: |
          if [ -f "ShiWanJu-Android-deploy.zip" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "ShiWanJu-Android-deploy.zip is not in the repository yet; skipping the APK build."
          fi

      - name: Set up JDK 17
        if: steps.source.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        if: steps.source.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project and apply repository logo
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          unzip -q ShiWanJu-Android-deploy.zip -d source
          PROJECT="source/ShiWanJu-Android"
          test -f "$PROJECT/app/build.gradle.kts"
          mkdir -p "$PROJECT/app/src/main/res/drawable-nodpi"
          # The repository SVG is the single source of truth for the app logo.
          python3 -m pip install --quiet pillow cairosvg
          python3 - <<'PY'
          import cairosvg
          from io import BytesIO
          from PIL import Image, ImageOps
          from pathlib import Path
          svg = Path("拾万句_简_淡黄色.svg")
          if not svg.is_file():
              raise SystemExit("Missing authoritative logo: 拾万句_简_淡黄色.svg")
          # Rasterize the original SVG without recoloring or cropping its artwork.
          png = cairosvg.svg2png(url=str(svg), output_width=1024, output_height=952)
          artwork = Image.open(BytesIO(png)).convert("RGBA")
          square = Image.new("RGBA", (1024, 1024), (0, 0, 0, 0))
          square.alpha_composite(artwork, ((1024-artwork.width)//2, (1024-artwork.height)//2))
          drawable = Path("source/ShiWanJu-Android/app/src/main/res/drawable-nodpi")
          drawable.mkdir(parents=True, exist_ok=True)
          square.save(drawable / "app_logo.png", optimize=True)
          bg = (1, 204, 122, 255)
          for density, size in [("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)]:
              folder = Path("source/ShiWanJu-Android/app/src/main/res") / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              # Match the adaptive icon safe-area ratio exactly (66/108); no legacy/adaptive size drift.
              fitted = ImageOps.contain(square, (round(size * 66 / 108), round(size * 66 / 108)), method=Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA", (size, size), bg)
              canvas.alpha_composite(fitted, ((size-fitted.width)//2, (size-fitted.height)//2))
              canvas.save(folder / "ic_launcher.png", optimize=True)
              canvas.save(folder / "ic_launcher_round.png", optimize=True)
          # Android adaptive icon foreground: artwork occupies the standard 66dp safe area
          # of the 108dp canvas. Legacy launcher PNGs use the same 66/108 ratio.
          safe = ImageOps.contain(square, (66, 66), method=Image.Resampling.LANCZOS)
          safe_canvas = Image.new("RGBA", (108, 108), (0, 0, 0, 0))
          safe_canvas.alpha_composite(safe, ((108-safe.width)//2, (108-safe.height)//2))
          safe_canvas.save(drawable / "launcher_logo_foreground.png", optimize=True)
          bounds = safe_canvas.getchannel("A").getbbox()
          if not bounds or bounds[2] - bounds[0] > 66 or bounds[3] - bounds[1] > 66:
              raise SystemExit(f"Adaptive icon artwork exceeds safe area: {bounds}")
          print(f"Logo assets normalized: legacy/adaptive artwork ratio {66/108:.4f}; adaptive alpha bounds {bounds}")
          PY
          rm -f "$PROJECT/app/src/main/res/drawable-nodpi/app_logo.jpg"
          # Apply Kotlin/engine/data fixes onto the untouched original native project.
          # Do not overlay the previous HomeScreen/MainActivity experiment.
          python3 native-overlay/apply_patches.py
          python3 native-overlay/apply_theme_colors.py
          python3 native-overlay/generate_icon_styles.py
          python3 native-overlay/apply_icon_styles.py
          cat > "$PROJECT/app/src/main/res/drawable/ic_launcher_background.xml" <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#01CC7A" android:pathData="M0,0h108v108h-108z" />
          </vector>
          XML
          # Use the 108x108 PNG directly. Do not wrap it in another sized layer-list:
          # that previously applied a second 58dp shrink to adaptive/splash icons.
          rm -f "$PROJECT/app/src/main/res/drawable/ic_launcher_foreground.xml"
          cat > "$PROJECT/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml" <<'XML'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/launcher_logo_foreground" />
          </adaptive-icon>
          XML
          cp "$PROJECT/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml" "$PROJECT/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"
          # Keep every APK build installable as an update: APP_VERSION is bumped in the repository per release.
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path(".")
          code = int((root / "APP_VERSION").read_text(encoding="utf-8").strip())
          gradle = Path("source/ShiWanJu-Android/app/build.gradle.kts")
          source = gradle.read_text(encoding="utf-8")
          source, n1 = re.subn(r'(?m)^(\s*versionCode\s*=\s*)\d+', rf'\g<1>{code}', source, count=1)
          source, n2 = re.subn(r'(?m)^(\s*versionName\s*=\s*)"[^"]+"', rf'\g<1>"1.0.{code}"', source, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f"Unable to set APK version: versionCode={n1}, versionName={n2}")
          gradle.write_text(source, encoding="utf-8")
          print(f"APK version set to 1.0.{code} (versionCode {code})")
          PY
          sed -i 's/android:roundIcon="@mipmap\/ic_launcher"/android:roundIcon="@mipmap\/ic_launcher_round"/' "$PROJECT/app/src/main/AndroidManifest.xml"
          # Kotlin property setter and custom method had the same JVM signature.
          sed -i 's/fun setTextViewMode(/fun updateTextViewMode(/' "$PROJECT/app/src/main/java/com/shiwanju/app/ui/AppViewModel.kt"
          sed -i 's/vm.setTextViewMode(/vm.updateTextViewMode(/g' "$PROJECT/app/src/main/java/com/shiwanju/app/ui/MyScreens.kt"

      - name: Build debug APK
        if: steps.source.outputs.present == 'true'
        run: gradle --no-daemon -p source/ShiWanJu-Android :app:assembleDebug

      - name: Upload APK
        if: steps.source.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ShiWanJu-debug-apk
          path: source/ShiWanJu-Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package patched native source
        if: steps.source.outputs.present == 'true'
        run: |
          cd source
          zip -qr ../ShiWanJu-Android-native-source.zip ShiWanJu-Android -x 'ShiWanJu-Android/build/*' 'ShiWanJu-Android/app/build/*' 'ShiWanJu-Android/.gradle/*'

      - name: Upload patched native source
        if: steps.source.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ShiWanJu-native-source
          path: ShiWanJu-Android-native-source.zip
          if-no-files-found: error
          retention-days: 14
