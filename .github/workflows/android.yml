name: Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source archive
        id: source
        shell: bash
        run: |
          if [ -f "ShiWanJu-Android-deploy.zip" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "ShiWanJu-Android-deploy.zip is not in the repository yet; skipping the APK build."
          fi

      - name: Set up JDK 17
        if: steps.source.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        if: steps.source.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project and apply repository logo
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          unzip -q ShiWanJu-Android-deploy.zip -d source
          PROJECT="source/ShiWanJu-Android"
          test -f "$PROJECT/app/build.gradle.kts"
          mkdir -p "$PROJECT/app/src/main/res/drawable-nodpi"
          # The repository SVG is the single source of truth for the app logo.
          python3 -m pip install --quiet pillow cairosvg
          python3 - <<'PY'
          import cairosvg
          from io import BytesIO
          from PIL import Image, ImageOps
          from pathlib import Path
          svg = Path("拾万句_简_淡黄色.svg")
          if not svg.is_file():
              raise SystemExit("Missing authoritative logo: 拾万句_简_淡黄色.svg")
          # Preserve the original vector paths while standardizing the logo to pure white.
          svg_text = svg.read_text(encoding="utf-8").replace("#fff1d2", "#ffffff").replace("#FFF1D2", "#FFFFFF")
          png = cairosvg.svg2png(bytestring=svg_text.encode("utf-8"), output_width=1024, output_height=952)
          artwork = Image.open(BytesIO(png)).convert("RGBA")
          square = Image.new("RGBA", (1024, 1024), (0, 0, 0, 0))
          square.alpha_composite(artwork, ((1024-artwork.width)//2, (1024-artwork.height)//2))
          drawable = Path("source/ShiWanJu-Android/app/src/main/res/drawable-nodpi")
          drawable.mkdir(parents=True, exist_ok=True)
          square.save(drawable / "app_logo.png", optimize=True)
          bg = (1, 204, 122, 255)
          for density, size in [("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)]:
              folder = Path("source/ShiWanJu-Android/app/src/main/res") / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              # Match the adaptive icon safe-area ratio exactly (66/108); no legacy/adaptive size drift.
              fitted = ImageOps.contain(square, (round(size * 66 / 108), round(size * 66 / 108)), method=Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA", (size, size), bg)
              canvas.alpha_composite(fitted, ((size-fitted.width)//2, (size-fitted.height)//2))
              canvas.save(folder / "ic_launcher.png", optimize=True)
              canvas.save(folder / "ic_launcher_round.png", optimize=True)
          # Android adaptive icon foreground: artwork occupies the standard 66dp safe area
          # of the 108dp canvas. Legacy launcher PNGs use the same 66/108 ratio.
          safe = ImageOps.contain(square, (66, 66), method=Image.Resampling.LANCZOS)
          safe_canvas = Image.new("RGBA", (108, 108), (0, 0, 0, 0))
          safe_canvas.alpha_composite(safe, ((108-safe.width)//2, (108-safe.height)//2))
          safe_canvas.save(drawable / "launcher_logo_foreground.png", optimize=True)
          bounds = safe_canvas.getchannel("A").getbbox()
          if not bounds or bounds[2] - bounds[0] > 66 or bounds[3] - bounds[1] > 66:
              raise SystemExit(f"Adaptive icon artwork exceeds safe area: {bounds}")
          print(f"Logo assets normalized: legacy/adaptive artwork ratio {66/108:.4f}; adaptive alpha bounds {bounds}")
          PY
          rm -f "$PROJECT/app/src/main/res/drawable-nodpi/app_logo.jpg"

      - name: Apply native project patches
        if: steps.source.outputs.present == 'true'
        run: |
          python3 native-overlay/apply_patches.py

      - name: Add article editor and custom style modules
        if: steps.source.outputs.present == 'true'
        run: python3 native-overlay/apply_article_editor.py

      - name: Add persistent style category IDs and template origin
        if: steps.source.outputs.present == 'true'
        run: python3 native-overlay/apply_style_categories.py

      - name: Apply article editor Stage B selection foundation
        if: steps.source.outputs.present == 'true'
        run: python3 native-overlay/apply_article_editor_stage_b.py

      - name: Refine article editor Stage C2 floating toolbar and category dock
        if: steps.source.outputs.present == 'true'
        run: python3 native-overlay/apply_article_editor_stage_c2.py

      - name: Upload article editor patch diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article-editor-patch-diagnostic
          path: |
            article_editor_patch_error.txt
            article_editor_stage_b_patch_error.txt
            article_editor_stage_c2_patch_error.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Apply theme colors
        if: steps.source.outputs.present == 'true'
        run: python3 native-overlay/apply_theme_colors.py

      # Safe-area regression pass 3: match actual page root surface anchors.
      - name: Normalize page system-bar safe areas
        if: steps.source.outputs.present == 'true'
        run: python3 native-overlay/fix_page_safe_areas.py

      - name: Apply existing UI refinements
        if: steps.source.outputs.present == 'true'
        run: python3 native-overlay/apply_ui_refinements.py

      - name: Refine My page cards and history editor
        if: steps.source.outputs.present == 'true'
        run: python3 native-overlay/refine_my_cards.py

      - name: Refine layout toolbar and image scrolling
        if: steps.source.outputs.present == 'true'
        run: python3 native-overlay/refine_layout_toolbar.py

      - name: Refine text-only history selection
        if: steps.source.outputs.present == 'true'
        run: python3 native-overlay/refine_history_selection.py

      - name: Generate launcher icons and splash screen
        if: steps.source.outputs.present == 'true'
        run: |
          python3 native-overlay/generate_icon_styles.py
          python3 native-overlay/apply_icon_styles.py
          python3 native-overlay/apply_splash.py

      - name: Refine settings UI
        if: steps.source.outputs.present == 'true'
        run: python3 native-overlay/refine_settings.py

      - name: Enforce separate Xingtu and Xiumi editor routes
        if: steps.source.outputs.present == 'true'
        run: python3 native-overlay/ensure_article_editor_route.py
      # Validate that camera/Edit/palette entries resolve to different Compose screens.


      - name: Apply object-aware editor bottom navigation v2
        if: steps.source.outputs.present == 'true'
        run: python3 native-overlay/apply_editor_bottom_nav_v2.py

      - name: Apply object-safe editor actions and component tools v3
        if: steps.source.outputs.present == 'true'
        run: python3 native-overlay/apply_editor_functional_v3.py

      - name: Finalize text and image editor dock interactions v4
        if: steps.source.outputs.present == 'true'
        run: python3 native-overlay/apply_editor_functional_v4.py

      - name: Unify canvas object hit testing and bottom dock routing v5
        if: steps.source.outputs.present == 'true'
        run: python3 native-overlay/apply_editor_selection_v5.py

      - name: Repair object dock routing and image import v6
        if: steps.source.outputs.present == 'true'
        run: python3 native-overlay/apply_editor_selection_v6.py

      - name: Add dedicated text and image selection docks v7
        if: steps.source.outputs.present == 'true'
        run: python3 native-overlay/apply_editor_selection_dock_v7.py

      - name: Fix Xingtu expandable bottom sheet interaction
        if: steps.source.outputs.present == 'true'
        run: python3 native-overlay/fix_xingtu_bottom_sheet.py

      - name: Restore default dock on empty canvas lines
        if: steps.source.outputs.present == 'true'
        run: python3 native-overlay/fix_empty_line_default_dock.py

      - name: Keep default dock secondary panels open
        if: steps.source.outputs.present == 'true'
        run: python3 native-overlay/fix_default_dock_panel_dismiss.py

      - name: Keep selected editor content visible above keyboard and tool panels
        if: steps.source.outputs.present == 'true'
        run: python3 native-overlay/keep_editor_target_visible_above_ime_and_panel.py


      - name: Upload editor selection and image import diagnostics v6
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-selection-v6-diagnostic
          path: |
            editor_selection_v6_patch_error.txt
            editor_selection_dock_v7_patch_error.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload canvas selection patch diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-selection-v5-diagnostic
          path: editor_selection_v5_patch_error.txt
          if-no-files-found: ignore
          retention-days: 7

      # Run last because route enforcement rewrites MainActivity; verify the final source.
      - name: Apply and verify status bar icon contrast
        if: steps.source.outputs.present == 'true'
        run: python3 native-overlay/fix_status_bar.py


      - name: Finalize Android resources and version
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          PROJECT="source/ShiWanJu-Android"
          rm -f "$PROJECT/app/src/main/res/drawable/ic_launcher_background.xml"
          rm -f "$PROJECT/app/src/main/res/drawable/ic_launcher_foreground.xml"
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          root = Path(".")
          code = int((root / "APP_VERSION").read_text(encoding="utf-8").strip())
          base_version = (root / "APP_VERSION_NAME").read_text(encoding="utf-8").strip()
          if not re.fullmatch(r"\d+\.\d+\.\d+", base_version):
              raise SystemExit(f"Invalid APP_VERSION_NAME: {base_version}")
          build_number = os.environ.get("GITHUB_RUN_NUMBER", "").strip()
          if not build_number.isdigit():
              raise SystemExit(f"Invalid APK build number: {build_number!r}")
          version_name = f"{base_version}:{build_number}"
          gradle = Path("source/ShiWanJu-Android/app/build.gradle.kts")
          source = gradle.read_text(encoding="utf-8")
          source, n1 = re.subn(r'(?m)^(\s*versionCode\s*=\s*)\d+', rf'\g<1>{code}', source, count=1)
          source, n2 = re.subn(r'(?m)^(\s*versionName\s*=\s*)"[^"]+"', lambda m: m.group(1) + '"' + version_name + '"', source, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f"Unable to set APK version: versionCode={n1}, versionName={n2}")
          gradle.write_text(source, encoding="utf-8")
          print(f"APK version set to {version_name} (versionCode {code})")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"APK_VERSION_NAME={version_name}\n")
              env.write(f"APK_BUILD_NUMBER={build_number}\n")
          PY
          sed -i 's/android:roundIcon="@mipmap\/ic_launcher"/android:roundIcon="@mipmap\/ic_launcher_round"/' "$PROJECT/app/src/main/AndroidManifest.xml"
          sed -i 's/fun setTextViewMode(/fun updateTextViewMode(/' "$PROJECT/app/src/main/java/com/shiwanju/app/ui/AppViewModel.kt"
          sed -i 's/vm.setTextViewMode(/vm.updateTextViewMode(/g' "$PROJECT/app/src/main/java/com/shiwanju/app/ui/MyScreens.kt"

      - name: Diagnose final Kotlin source before APK build
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          echo "=== ArticleEditorScreen.kt lines 1820-1840 ==="
          nl -ba source/ShiWanJu-Android/app/src/main/java/com/shiwanju/app/ui/ArticleEditorScreen.kt | sed -n '1820,1840p'
          echo "=== Bottom sheet drag header ==="
          grep -n -A12 -B2 'detectDragGestures' source/ShiWanJu-Android/app/src/main/java/com/shiwanju/app/ui/ArticleEditorScreen.kt | head -40
          echo "=== Text2EditorPanel references ==="
          grep -n -A18 -B3 'Text2EditorPanel(' source/ShiWanJu-Android/app/src/main/java/com/shiwanju/app/ui/ArticleEditorScreen.kt | head -60

      - name: Build debug APK
        if: steps.source.outputs.present == 'true'
        run: gradle --no-daemon -p source/ShiWanJu-Android :app:assembleDebug

      - name: Label APK with version and build number
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          APK_DIR="source/ShiWanJu-Android/app/build/outputs/apk/debug"
          APK_FILE="$APK_DIR/app-debug.apk"
          test -f "$APK_FILE"
          APK_LABEL="${APK_VERSION_NAME//:/-}"
          mv "$APK_FILE" "$APK_DIR/ShiWanJu-${APK_LABEL}.apk"

      - name: Upload APK
        if: steps.source.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ShiWanJu-debug-apk-${{ github.run_number }}
          path: source/ShiWanJu-Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package patched native source
        if: steps.source.outputs.present == 'true'
        run: |
          cd source
          zip -qr ../ShiWanJu-Android-native-source.zip ShiWanJu-Android -x 'ShiWanJu-Android/build/*' 'ShiWanJu-Android/app/build/*' 'ShiWanJu-Android/.gradle/*'

      - name: Upload patched native source
        if: steps.source.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ShiWanJu-native-source
          path: ShiWanJu-Android-native-source.zip
          if-no-files-found: error
          retention-days: 14
