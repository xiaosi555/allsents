name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source archive
        id: source
        shell: bash
        run: |
          if [ -f "ShiWanJu-Android-deploy.zip" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "ShiWanJu-Android-deploy.zip is not in the repository yet; skipping the APK build."
          fi

      - name: Set up JDK 17
        if: steps.source.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        if: steps.source.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project and apply repository logo
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          unzip -q ShiWanJu-Android-deploy.zip -d source
          PROJECT="source/ShiWanJu-Android"
          test -f "$PROJECT/app/build.gradle.kts"
          mkdir -p "$PROJECT/app/src/main/res/drawable-nodpi"
          cp IMG_20261017_090019.jpg "$PROJECT/app/src/main/res/drawable-nodpi/app_logo.jpg"
          # Regenerate every legacy launcher density from the same complete square source image.
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          src = Image.open("IMG_20261017_090019.jpg").convert("RGBA")
          bg = (86, 210, 116, 255)
          for density, size in [("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)]:
              folder = Path("source/ShiWanJu-Android/app/src/main/res") / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              fitted = ImageOps.contain(src, (int(size * 0.78), int(size * 0.78)), method=Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA", (size, size), bg)
              canvas.alpha_composite(fitted, ((size-fitted.width)//2, (size-fitted.height)//2))
              canvas.save(folder / "ic_launcher.png", optimize=True)
              canvas.save(folder / "ic_launcher_round.png", optimize=True)
          PY
          # Apply Kotlin/engine/data fixes onto the untouched original native project.
          # Do not overlay the previous HomeScreen/MainActivity experiment.
          python3 native-overlay/apply_patches.py
          cat > "$PROJECT/app/src/main/res/drawable/ic_launcher_background.xml" <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#56D274" android:pathData="M0,0h108v108h-108z" />
          </vector>
          XML
          cat > "$PROJECT/app/src/main/res/drawable/ic_launcher_foreground.xml" <<'XML'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:width="66dp" android:height="66dp" android:gravity="center">
                  <bitmap android:src="@drawable/app_logo" android:gravity="centerInside" />
              </item>
          </layer-list>
          XML
          cat > "$PROJECT/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml" <<'XML'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          XML
          cp "$PROJECT/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml" "$PROJECT/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"
          # Keep every APK build installable as an update: APP_VERSION is bumped in the repository per release.
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path(".")
          code = int((root / "APP_VERSION").read_text(encoding="utf-8").strip())
          gradle = Path("source/ShiWanJu-Android/app/build.gradle.kts")
          source = gradle.read_text(encoding="utf-8")
          source, n1 = re.subn(r'(?m)^(\s*versionCode\s*=\s*)\d+', rf'\g<1>{code}', source, count=1)
          source, n2 = re.subn(r'(?m)^(\s*versionName\s*=\s*)"[^"]+"', rf'\g<1>"1.0.{code}"', source, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f"Unable to set APK version: versionCode={n1}, versionName={n2}")
          gradle.write_text(source, encoding="utf-8")
          print(f"APK version set to 1.0.{code} (versionCode {code})")
          PY
          sed -i 's/android:roundIcon="@mipmap\/ic_launcher"/android:roundIcon="@mipmap\/ic_launcher_round"/' "$PROJECT/app/src/main/AndroidManifest.xml"
          # Kotlin property setter and custom method had the same JVM signature.
          sed -i 's/fun setTextViewMode(/fun updateTextViewMode(/' "$PROJECT/app/src/main/java/com/shiwanju/app/ui/AppViewModel.kt"
          sed -i 's/vm.setTextViewMode(/vm.updateTextViewMode(/g' "$PROJECT/app/src/main/java/com/shiwanju/app/ui/MyScreens.kt"

      - name: Build debug APK
        if: steps.source.outputs.present == 'true'
        run: gradle --no-daemon -p source/ShiWanJu-Android :app:assembleDebug

      - name: Upload APK
        if: steps.source.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ShiWanJu-debug-apk
          path: source/ShiWanJu-Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package patched native source
        if: steps.source.outputs.present == 'true'
        run: |
          cd source
          zip -qr ../ShiWanJu-Android-native-source.zip ShiWanJu-Android -x 'ShiWanJu-Android/build/*' 'ShiWanJu-Android/app/build/*' 'ShiWanJu-Android/.gradle/*'

      - name: Upload patched native source
        if: steps.source.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ShiWanJu-native-source
          path: ShiWanJu-Android-native-source.zip
          if-no-files-found: error
          retention-days: 14
