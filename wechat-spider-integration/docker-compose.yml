services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DEPLOY: docker
    ports:
      - "8101:8101"
      - "8104:8104"
    depends_on:
      - mongo
      - redis
    volumes:
      - spider_ca:/root/.anyproxy
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - spider_mongo:/data/db
  redis:
    image: redis:7-alpine
    restart: unless-stopped
volumes:
  spider_ca:
  spider_mongo:
