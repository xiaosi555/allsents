<script>
// ===========Tab切换逻辑============
const tabItems = document.querySelectorAll('.tab-item');
tabItems.forEach(tab=>{
    tab.onclick = function(){
        tabItems.forEach(i=>{
            i.classList.remove('tab-active');
            i.classList.add('text-gray-500');
        })
        this.classList.add('tab-active');
        this.classList.remove('text-gray-500');
        const targetId = this.dataset.tab;
        document.querySelectorAll('.tab-panel').forEach(panel=>panel.classList.remove('show'));
        document.getElementById(targetId).classList.add('show');
    }
})

//子tab切换：生成HTML代码 / 预览HTML
const subTabs = document.querySelectorAll('.sub-tab');
subTabs.forEach(st=>{
    st.onclick = function(){
        subTabs.forEach(s=>{
            s.classList.remove('tab-active');
            s.classList.add('text-gray-500');
        })
        this.classList.add('tab-active');
        this.classList.remove('text-gray-500');
        const subKey = this.dataset.subtab;
        document.querySelectorAll('.sub-panel').forEach(p=>p.classList.add('hidden'));
        document.getElementById('sub'+subKey.charAt(0).toUpperCase()+subKey.slice(1)+'Panel').classList.remove('hidden');
    }
})

// =========输入框放大缩小功能 =========
const inputBoxWrap = document.getElementById('inputBoxWrap');
const btnZoom = document.getElementById('btnTextareaZoom');
let isZoom = false;

btnZoom.onclick = function(){
    isZoom = !isZoom;
    if(isZoom){
        inputBoxWrap.classList.add('input-fullscreen');
        btnZoom.innerHTML = '<i class="fa fa-compress"></i>';
    }else{
        inputBoxWrap.classList.remove('input-fullscreen');
        btnZoom.innerHTML = '<i class="fa fa-expand"></i>';
    }
}

//代码复制按钮
document.getElementById('btnCopyCode').onclick = async function(){
    const val = document.getElementById('outCode').value;
    await navigator.clipboard.writeText(val);
    alert("已复制代码");
}

// 预览HTML右上角的“全选”按钮逻辑
document.getElementById('btnSelectAllPreview').onclick = function(){
    const previewBox = document.getElementById('previewBox');
    if (window.getSelection && document.createRange) {
        const range = document.createRange();
        range.selectNodeContents(previewBox);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
    }
}

// ===========业务状态变量============
let selectCount = 6;
let selectLayout = "moment";
let lastGeneratedHtml = "";

//句数按钮点击
document.querySelectorAll('.btn-num').forEach(btn=>{
    btn.onclick = function(){
        document.querySelectorAll('.btn-num').forEach(b=>b.classList.remove('btn-num-active'));
        this.classList.add('btn-num-active');
        selectCount = Number(this.dataset.num);
        document.getElementById('customNum').value = '';
        document.getElementById('syncCountInput').value = selectCount;
    }
})
//自定义输入数量
document.getElementById('customNum').addEventListener('input',e=>{
    const val = Number(e.target.value);
    if(val>0) {
        selectCount = val;
        document.getElementById('syncCountInput').value = val;
    }
    document.querySelectorAll('.btn-num').forEach(b=>b.classList.remove('btn-num-active'));
});

// 同步栏数量输入框绑定联动
document.getElementById('syncCountInput').addEventListener('input', e=>{
    const val = Number(e.target.value);
    if(val>0) {
        selectCount = val;
    }
});

//版式点击
document.querySelectorAll('.btn-layout').forEach(btn=>{
    btn.onclick = function(){
        document.querySelectorAll('.btn-layout').forEach(b=>{
            b.classList.remove('bg-selectGray','border-2','border-mainGreen');
            b.classList.add('bg-white','border');
        })
        this.classList.remove('bg-white');
        this.classList.add('bg-selectGray','border-2','border-mainGreen');
        selectLayout = this.dataset.layout;
    }
})

function getSentenceList(){
    const raw = document.getElementById('inputTextarea').value;
    let lines = raw.split('\n').map(s=>s.trim()).filter(s=>s!=='');
    
    if(lines.length === 0) {
        lines = [
            "生活原本沉闷，但跑起来就有风。——村上春树",
            "你要去相信，没有到不了的明天。——卢思浩",
            "岁月极美，在于它必然的流逝。——三毛",
            "星光不问赶路人，时光不负有心人。——网络",
            "凡是过往，皆为序章。——莎士比亚",
            "愿你出走半生，归来仍是少年。——苏轼",
            "追光的人，自己也会身披万丈光芒。——拾万句",
            "纵然万般皆苦，你也要自成一派。——网易云热评",
            "向阳而生，逐光而行。——致自己"
        ];
    }
    
    const result = [];
    for(let line of lines){
        if(line.includes('——')){
            const parts = line.split('——');
            result.push({
                text: parts[0].trim(),
                source: (parts[1]||'').trim()
            })
        }else{
            result.push({
                text: line.trim(),
                source: ''
            })
        }
    }
    return result.slice(0, selectCount);
}

// 辅助函数：将内容进行等分并各自分别居中对齐处理
function wrapWithCenteredFlex(itemsHtml) {
    return `<div style="display:flex; flex-direction:column; justify-content:space-around; align-items:center; width:100%; box-sizing:border-box;">${itemsHtml}</div>`;
}

function buildMomentHtml(sentences){

    const sampleImg = `https://res.cloudinary.com/divete82s/image/upload/v1755071564/n2tnqdbb0dcvke4yhp3u.jpg`;
    let itemHtml = '';
    sentences.forEach((item,idx)=>{
        const min = idx+1;
        itemHtml += `
    <div style="margin-top:12px; padding-bottom:12px; width:100%; text-align:center;">
      <div style="display:flex; align-items:center; justify-content:center;">
        <img src="${avatarImg}" style="width:40px; height:40px; border-radius:15%; object-fit:cover; display:block;">
        <span style="margin-left:10px; font-size:16px; font-weight:500; color:#444444;">拾万句</span>
      </div>
      <div style="margin-top:10px; font-size:16px; line-height:1.6; color:#333333; text-align:center; white-space:pre-wrap;">${item.text}</div>
      <div style="display:flex; justify-content:center; width:100%;">
        <img src="${sampleImg}" style="width:160px; height:auto; object-fit:cover; border-radius:2px; display:block; margin-top:10px;">
      </div>
      <div style="margin-top:6px; font-size:12px; color:#999999; text-align:center;">${min}分钟前</div>
    </div>`;
    })
    return wrapWithCenteredFlex(itemHtml);
}

      <span leaf="">PART</span>
    </span>
    <span style="display:block!important;width:100%!important;text-align:center!important;margin:0!important;padding:0!important;vertical-align:top!important;font-size:28px!important;color:#999!important;">
      <span leaf="">${num}</span>
    </span>
  </section>
  <section style="margin:0 auto !important;padding:0!important;margin-bottom:20px!important;text-align:center!important;">
    <span style="display:block!important;width:100%!important;text-align:center!important;color:#444!important;letter-spacing:3px!important;font-size:18px!important;font-weight:300!important;text-indent:0!important;white-space:normal!important;margin:0!important;padding:0!important;">
      <span leaf="">${item.text}</span>
    </span>
  </section>
  <span style="display:block!important;width:100%!important;margin:0!important;padding:0!important;text-align:center!important;">
    <span leaf="">${item.source}</span>

</section>`;
    })
    return wrapWithCenteredFlex(htmlBody);
}

function buildDuanzhangHtml(sentences){
    let html = '';
    sentences.forEach((item,idx)=>{
        const numStr = String(idx+1).padStart(2,'0');
        html += `
<div style="width:100%; text-align:center; margin-bottom:20px;">
  <p style="white-space: normal; margin: 0px auto; padding: 0px; box-sizing: border-box; color:#999; text-align:center;"><strong style="box-sizing: border-box;"><span leaf="" style="visibility: visible;">${numStr}</span></strong></p>
  <section style="text-align: center; font-size: 15px; line-height: 2; padding: 0px 20px; letter-spacing: 1px; font-family: &quot;Source Han Sans CN Normal&quot;; box-sizing: border-box;">
    <p style="margin: 0px auto; padding: 0px; box-sizing: border-box; text-align:center;"><span leaf="" style="visibility: visible;">${item.text}</span></p>
    <p style="margin: 0px auto; padding: 0px; box-sizing: border-box;"><span leaf="" style="visibility: visible;"><br /></span></p>
    <p style="margin: 0px auto; padding: 0px; box-sizing: border-box; text-align:center;"><strong style="box-sizing: border-box;"><span leaf="" style="visibility: visible;">${item.source}</span></strong></p>
  </section>
</div>`;
    })
    return wrapWithCenteredFlex(html);
}

function getCurrentLayoutHtml(){
    const list = getSentenceList();
    let resultHtml = '';
    switch(selectLayout){
        case 'moment': resultHtml = buildMomentHtml(list); break;
        case 'breakline': resultHtml = buildBreaklineHtml(list); break;
        case 'card': resultHtml = buildCardHtml(list); break;
        case 'purebg': resultHtml = buildDuanzhangHtml(list); break;
        default: resultHtml = `<!--版式未实现-->`;
    }
    lastGeneratedHtml = resultHtml;
    return resultHtml;
}

document.getElementById('btnSyncPublic').onclick = function(){
    const html = getCurrentLayoutHtml();
    document.getElementById('outCode').value = html;
    document.getElementById('previewBox').innerHTML = html;
}
</script>
