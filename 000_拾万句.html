#333333;\\\"\u003e\\u003cstrong style=\\\"box-sizing: border-box; visibility: visible;\\\"\u003e\\u003cspan leaf=\\\"\\\" style=\\\"visibility: visible;\\\"\u003e01\\u003c/span\u003e\\u003c/strong\u003e\\u003c/p\u003e \\u003csection style=\\\"text-align: left; font-size: 15px; line-height: 2; padding: 0px 30px; letter-spacing: 1px; font-family: \u0026quot;Source Han Sans CN Normal\u0026quot;; box-sizing: border-box; visibility: visible;\\\"\u003e \\u003cp style=\\\"margin: 0px; padding: 0px; box-sizing: border-box; visibility: visible;\\\"\u003e\\u003cspan leaf=\\\"\\\" style=\\\"visibility: visible;\\\"\u003e愿中国青年都摆脱冷气，只是向上走。\\u003c/span\u003e\\u003c/p\u003e \\u003cp style=\\\"margin: 0px; padding: 0px; box-sizing: border-box; visibility: visible;\\\"\u003e\\u003cspan leaf=\\\"\\\" style=\\\"visibility: visible;\\\"\u003e\\u003cbr /\u003e\\u003c/span\u003e\\u003c/p\u003e \\u003cp style=\\\"margin: 0px; padding: 0px; box-sizing: border-box; visibility: visible;\\\"\u003e\\u003cstrong style=\\\"box-sizing: border-box; visibility: visible;\\\"\u003e\\u003cspan leaf=\\\"\\\" style=\\\"visibility: visible;\\\"\u003e鲁迅《热风》\\u003c/span\u003e\\u003c/strong\u003e\\u003c/p\u003e \\u003cp style=\\\"margin: 0px; padding: 0px; box-sizing: border-box; visibility: visible;\\\"\u003e\\u003cspan leaf=\\\"\\\" style=\\\"visibility: visible;\\\"\u003e\\u003cbr /\u003e\\u003c/span\u003e\\u003c/p\u003e \\u003c/section\u003e \\u003cp style=\\\"white-space: normal; margin: 0px; padding: 0px; box-sizing: border-box; visibility: visible; color:#333333;\\\"\u003e\\u003cstrong style=\\\"box-sizing: border-box; visibility: visible;\\\"\u003e\\u003cspan leaf=\\\"\\\" style=\\\"visibility: visible;\\\"\u003e02\\u003c/span\u003e\\u003c/strong\u003e\\u003c/p\u003e \\u003csection style=\\\"text-align: left; font-size: 15px; line-height: 2; padding: 0px 30px; letter-spacing: 1px; font-family: \u0026quot;Source Han Sans CN Normal\u0026quot;; box-sizing: border-box; visibility: visible;\\\"\u003e \\u003cp style=\\\"margin: 0px; padding: 0px; box-sizing: border-box; visibility: visible;\\\"\u003e\\u003cspan leaf=\\\"\\\" style=\\\"visibility: visible;\\\"\u003e世界上只有一种英雄主义，就是在认清生活真相之后依然热爱生活。\\u003c/span\u003e\\u003c/p\u003e \\u003cp style=\\\"margin: 0px; padding: 0px; box-sizing: border-box; visibility: visible;\\\"\u003e\\u003cspan leaf=\\\"\\\" style=\\\"visibility: visible;\\\"\u003e\\u003cbr /\u003e\\u003c/span\u003e\\u003c/p\u003e \\u003cp style=\\\"margin: 0px; padding: 0px; box-sizing: border-box; visibility: visible;\\\"\u003e\\u003cstrong style=\\\"box-sizing: border-box; visibility: visible;\\\"\u003e\\u003cspan leaf=\\\"\\\" style=\\\"visibility: visible;\\\"\u003e罗曼・罗兰《米开朗基罗传》\\u003c/span\u003e\\u003c/strong\u003e\\u003c/p\u003e \\u003cp style=\\\"margin: 0px; padding: 0px; box-sizing: border-box; visibility: visible;\\\"\u003e\\u003cspan leaf=\\\"\\\" style=\\\"visibility: visible;\\\"\u003e\\u003cbr /\u003e\\u003c/span\u003e\\u003c/p\u003e \\u003c/section\u003e \\u003cp style=\\\"white-space: normal; margin: 0px; padding: 0px; box-sizing: border-box; visibility: visible; color:#333333;\\\"\u003e\\u003cstrong style=\\\"box-sizing: border-box; visibility: visible;\\\"\u003e\\u003cspan leaf=\\\"\\\" style=\\\"visibility: visible;\\\"\u003e03\\u003c/span\u003e\\u003c/strong\u003e\\u003c/p\u003e \\u003csection style=\\\"text-align: left; font-size: 15px; line-height: 2; padding: 0px 30px; letter-spacing: 1px; font-family: \u0026quot;Source Han Sans CN Normal\u0026quot;; box-sizing: border-box; visibility: visible;\\\"\u003e \\u003cp style=\\\"margin: 0px; padding: 0px; box-sizing: border-box; visibility: visible;\\\"\u003e\\u003cspan leaf=\\\"\\\" style=\\\"visibility: visible;\\\"\u003e我们一路奋战，不是为了改变世界，而是为了不让世界改变我们。\\u003c/span\u003e\\u003c/p\u003e \\u003cp style=\\\"margin: 0px; padding: 0px; box-sizing: border-box; visibility: visible;\\\"\u003e\\u003cspan leaf=\\\"\\\" style=\\\"visibility: visible;\\\"\u003e\\u003cbr /\u003e\\u003c/span\u003e\\u003c/p\u003e \\u003cp style=\\\"margin: 0px; padding: 0px; box-sizing: border-box; visibility: visible;\\\"\u003e\\u003cstrong style=\\\"box-sizing: border-box; visibility: visible;\\\"\u003e\\u003cspan leaf=\\\"\\\" style=\\\"visibility: visible;\\\"\u003e熔炉\\u003c/span\u003e\\u003c/strong\u003e\\u003c/p\u003e \\u003cp style=\\\"margin: 0px; padding: 0px; box-sizing: border-box; visibility: visible;\\\"\u003e\\u003cspan leaf=\\\"\\\" style=\\\"visibility: visible;\\\"\u003e\\u003cbr /\u003e\\u003c/span\u003e\\u003c/p\u003e \\u003c/section\u003e\"}], \"files\": {\"text\": [{\"name\": \"短句\", \"title\": \"普普通通，却喜欢了很久的句子\\n普普通通，却喜欢很久的句子\", \"content\": \"把玫瑰藏于盛夏，把海棠藏于深秋。\\n外面的世界太杂乱，听自己的心就好。\\n因为有很好的人，所以生活很有意思。\\n走下去，前面有路，夜里有灯。\\n也许好运正在排队，等着见我，它也很焦急。\\n大方结束任何不真诚的关系，没什么不对。\\n人生之福，藏于微常。\\n人会因嘴硬失去很多东西，也会因为心软而受很多委屈。\\n的确，人在知足的时候最富有，在珍惜的时候最幸福。\\n有些话我听了会很开心，但我不会信。\\n不用刻意合群，有趣的人自然会相互吸引。\\n希望你的底色一直是善良、真诚、勇敢。\\n晚风吹人醒，万事藏于心，何以言，何能言，与谁言。\\n结局总是好的，如果不好，说明还不是结局。\\n万物更新，旧疾当愈；生来做春风，流浪又自由。\\n年轻时候，喜欢什么，都正常；成熟之后，放弃什么，都能理解。\\n是花自然香是爱自然长，没必要为没必要的人，浪费没必要的时间做没必要的事。\\n岁月浅浅，余生漫漫，予一半烟火，谋生活，许一半诗意得清欢。\\n生活最美的状态就是，人静，物简，心安。\\n不同年纪，不同取舍，人生百味，随意就好，以如常为喜，以如愿为安。\\n生命几许，遵从自己，会好，迟早。\\n以欢喜之心，渡烟火日常，念别人的好，修自己的心。\\n前路浩浩荡荡，万物皆可期待。\\n慢慢理解世界，慢慢更新自己。\\n山海自有归期，风雨自有相逢，意难平终将和解，万事终将如意。\\n记得给自己的开心充值，别让它停机了。\\n慢品人间烟火色，闲观岁月万事长。\\n二两桃花酿作酒，万杯不及你温柔。\\n不自卑也不炫耀，不动声色的变好。\\n生活不是什么都新鲜，安稳比什么都难得。\\n人的内心，不种满鲜花，就会长满杂草。\\n焦虑不会改变任何事，只能搅乱你的脑袋，偷走你的快乐！\\n今天的不开心到此为止，明天依然万丈光芒。\\n时间会筛选身边的人，值得的人一直值得。\\n桂花酒，少年游，大风吹散小忧愁。\\n我偷了落日的酒，与自己化敌为友。\\n日出是免费的，春夏秋冬也是。\\n外界的声音都是参考，你不开心就不要参考。\\n以欢喜之心，渡烟火日常，念他人的好，修自己的心。\\n酷的像风，野的像狗，不讨人喜，倒也自由。\\n希望是火，失望是烟，生活就是一边点火，一边冒烟。\\n爱是繁春里与万蝶对视的瞬息。\\n好事总会发生在下一个转弯。\\n因为有很好的人所以生活很有意思。\\n等日落西山等冬去春来等尘埃落定。\\n当善良遇见了温柔便是人间绝配。\\n我喜欢的少年打天上来他无意掀翻烛火点燃我双眸盛满的暮色。\\n所有的晦暗都留给过往从遇见你开始凛冬散尽星河长明。\"}]}}\u003c/script\u003e\n\u003cscript\u003e\n    const STORAGE_KEY = 'my_admin_data';\n    const SEED_FLAG_KEY = 'my_admin_seed_applied';\n    const SEED_ID = 'backup-2026-10-11-v1';\n    const TEXT_CATEGORIES = ['朋友圈', '名句'];\n    const SEED_DATA |序引/.test(n)) return 'duan';\n        if (/朋友圈/.test(n)) return 'moments';\n        if (/断句/.test(n)) return 'sentence';\n        if (/抖音/.test(n)) return 'douyin';\n        return '';\n    }\n\n    // 规范化：补全缺失结构；缺 id 的条目按顺序补确定性 id（两页结果一致）；文案缺类别默认【朋友圈】\n    function normalizeData(raw) {\n        const d = JSON.parse(JSON.stringify(raw || {}));\n        const arr = v =\u003e Array.isArray(v) ? v.filter(x =\u003e x \u0026\u0026 typeof x === 'object') : [];\n        d.accounts = arr(d.accounts);\n        d.layout = arr(d.layout);\n        d.history = arr(d.history);\n        d.emoji = arr(d.emoji);\n        d.files = (d.files \u0026\u0026 typeof d.files === 'object') ? d.files : {};\n        ['image', 'text', 'gif'].forEach(k =\u003e { d.files[k] = arr(d.files[k]); });\n\n        const fillIds = (list, prefix) =\u003e {\n            const used = new Set();\n            const missing = [];\n            list.forEach((it, i) =\u003e {\n                const has = it.id !== undefined \u0026\u0026 it.id !== null \u0026\u0026 String(it.id) !== '';\n                if (has \u0026\u0026 !used.has(String(it.id))) used.add(String(it.id)); else missing.push(i);\n            });\n            let n = 1;\n            missing.forEach(i =\u003e {\n                let id;\n                do { id = prefix + '_' + (n++); } while (used.has(id));\n                list[i].id = id;\n                used.add(id);\n            });\n        };\n        fillIds(d.accounts, 'acc');\n        fillIds(d.layout, 'layout');\n        fillIds(d.history, 'history');\n        fillIds(d.emoji, 'emoji');\n        ['image', 'text', 'gif'].forEach(k =\u003e fillIds(d.files[k], 'file_' + k));\n\n        d.accounts.forEach(a =\u003e { ['avatar', 'name', 'appId', 'secret', 'mpAvatar', 'author'].forEach(f =\u003e { if (a[f] === undefined || a[f] === null) a[f] = ''; }); });\n        ['image', 'text', 'gif'].forEach(k =\u003e d.files[k].forEach(f =\u003e {\n            ['name', 'title', 'content'].forEach(x =\u003e { if (f[x] === undefined || f[x] === null) f[x] = ''; });\n        }));\n        d.files.text.forEach(f =\u003e { if (!TEXT_CATEGORIES.includes(f.category)) f.category = '朋友圈'; });\n        if (d.layoutVer !== LAYOUT_VER) {\n            d.layout.forEach(l =\u003e { const k = layoutKindOf(l.name); if (k \u0026\u0026 LAYOUT_TPL[k]) l.content = LAYOUT_TPL[k]; });\n            d.layoutVer = LAYOUT_VER;\n        }\n        // 新增抖音版：只补一次（之后用户删除不会再自动补回）\n        if (!d.douyinAdded) {\n            if (!d.layout.some(l =\u003e /抖音/.test(l.name || ''))) {\n                const item = { id: 'layout_douyin', name: '04_抖音版', content: DOUYIN_TPL };\n                const at = d.layout.findIndex(l =\u003e /^\\s*05/.test(l.name || ''));\n                if (at \u003e= 0) d.layout.splice(at, 0, item); else d.layout.push(item);\n            }\n            d.douyinAdded = true;\n        }\n        return d;\n    }\n\n    const MY_PAGE_URL = '拾万句APP_03_我的.html'; // 如改了文件名，请同步修改此处\n    const UI_STATE_KEY = 'layout_page_ui_state';\n\n    function loadAppData() {\n        let raw = null;\n        try {\n            if (localStorage.getItem(SEED_FLAG_KEY) === SEED_ID) {\n                const s = localStorage.getItem(STORAGE_KEY);\n                if (s) raw = JSON.parse(s);\n            }\n        } catch (e) { raw = null; }\n        return normalizeData(raw || SEED_DATA);\n    }\n\n    function loadUiState() {\n        try { return JSON.parse(sessionStorage.getItem(UI_STATE_KEY)) || {}; } catch (e) { return {}; }\n    }\n    function saveUiState() {\n        try { sessionStorage.setItem(UI_STATE_KEY, JSON.stringify(ui)); } catch (e) {}\n    }\n\n    // 状态管理\n    let ui = Object.assign({\n        tab: 'copy', layoutId: null, quantity: 9, accountId: null, textCat: '朋友圈',\n        copyModuleId: null, copyLines: [],\n        imgModuleId: null, imgPool: [],\n        moreCat: 'image', gifId: null, historyId: null, mediaOrder: [], historyHtml: '', multiplier: 1, margins: {}, blankTop: false, blankBottom: false, blankAnchor: null, previewEmoji: '', gifContentOverride: ''\n    }, loadUiState());\n    let appData = loadAppData();\n\n    function esc(s) {\n        return String(s ?? '').replace(/[\u0026\u003c\u003e\"']/g, c =\u003e ({ '\u0026': '\u0026amp;', '\u003c': '\u0026lt;', '\u003e': '\u0026gt;', '\"': '\u0026quot;', \"'\": '\u0026#39;' }[c]));\n    }\n    function emptyTip(text) { return `\u003cdiv class=\"empty-tip\"\u003e${text}\u003c/div\u003e`; }\n\n    // 账号图标（沿用原样式，按顺序循环）\n    const ACCOUNT_ICONS = [\n        '\u003cpath d=\"M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2\"\u003e\u003c/path\u003e\u003ccircle cx=\"12\" cy=\"7\" r=\"4\"\u003e\u003c/circle\u003e',\n        '\u003cpath d=\"M4 19.5A2.5 2.5 0 0 1 6.5 17H20\"\u003e\u003c/path\u003e\u003cpath d=\"M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z\"\u003e\u003c/path\u003e',\n        '\u003ccircle cx=\"12\" cy=\"12\" r=\"10\"\u003e\u003c/circle\u003e\u003cpolyline points=\"12 6 12 12 16 14\"\u003e\u003c/polyline\u003e'\n    ];\n\n    // 版式缩略图样式（按版式名称关键词匹配，未匹配则按顺序循环）\n    const THUMB_STYLES = [\n        { key: '朋友圈', color: '#ccff00', bg: 'https://res.cloudinary.com/divete82s/image/upload/v1755071564/n2tnqdbb0dcvke4yhp3u.jpg' },\n        { key: '断章序引', color: '#ff9900', bg: 'https://res.cloudinary.com/divete82s/image/upload/v1755073735/qeryjvowvui1k1ddqd2d.png' },\n        { key: '文字断句', color: '#00ffff', bg: 'https://res.cloudinary.com/divete82s/image/upload/v1755071929/fbeoy35lzagjsrbwvy3z.jpg' },\n        { key: '卡片', color: '#ff6699', bg: 'https://res.cloudinary.com/divete82s/image/upload/v1755073952/xlcpmv2zuzwc4qojawcd.jpg' }\n  ];\n    function thumbFor(name, index) {\n        return THUMB_STYLES.find(t =\u003e String(name).includes(t.key)) || THUMB_STYLES[index % THUMB_STYLES.length];\n    }\n    function shortName(name) {\n        const s = String(name || '').replace(/^\\s*\\d+\\s*[_\\-.、\\s]+\\s*/, '');\n        return s || String(name || '');\n    }\n\n    function getLayoutIndex() {\n        let i = appData.layout.findIndex(l =\u003e String(l.id) === String(ui.layoutId));\n        if (i \u003c 0) i = appData.layout.length ? 0 : -1;\n        if (i \u003e= 0) ui.layoutId = appData.layout[i].id;\n        return i;\n    }\n\n    window.onload = function() { initFromData(); };\n    window.addEventListener('pageshow', e =\u003e { if (e.persisted) { appData = loadAppData(); initFromData(); } });\n    window.addEventListener('storage', e =\u003e { if (e.key === STORAGE_KEY || e.key === SEED_FLAG_KEY) { appData = loadAppData(); initFromData(); } });\n\n    const VALID_TABS = ['account', 'layout', 'copy', 'more'];\n    const IMG_POOL_SIZE = 20;\n    const COPY_POOL_SIZE = 80; // 足够覆盖 数量(≤15) × 倍率(≤5)\n\n    function findById(list, id) { return list.find(x =\u003e String(x.id) === String(id)); }\n    function sampleN(arr, n) {\n        const a = arr.slice();\n        for (let i = a.length - 1; i \u003e 0; i--) {\n            const j = Math.floor(Math.random() * (i + 1));\n            [a[i], a[j]] = [a[j], a[i]];\n        }\n        return a.slice(0, Math.max(0, n));\n    }\n    function splitLines(c) { return String(c || '').split(/\\r?\\n+/).map(x =\u003e x.trim()).filter(Boolean); }\n    // 文案条目分隔：文本里存在双换行（空行）时，按空行分条（条内的单换行保留为换行）；否则降级为按单个换行分条\n    function splitEntries(c) {\n        const t = String(c || '').replace(/\\r\\n?/g, '\\n').trim();\n        if (!t) return [];\n        if (/\\n[ \\t]*\\n/.test(t)) {\n            return t.split(/\\n(?:[ \\t]*\\n)+/).map(b =\u003e b.split('\\n').map(x =\u003e x.trim()).filter(Boolean).join('\\n')).filter(Boolean);\n        }\n        return t.split('\\n').map(x =\u003e x.trim()).filter(Boolean);\n    }\n    // 配图地址规范化：支持 http(s) / 协议相对(//) / 省略协议的域名(如 shturl.cc/xxx) / data:image / \u003cimg src\u003e / Markdown 图片\n    function normImgUrl(line) {\n        let u = String(line || '').trim();\n        if (!u) return '';\n        const m = /(?:src\\s*=\\s*[\"']|\\]\\()\\s*([^\"'\\s)]+)/i.exec(u);\n        if (m) u = m[1];\n        u = u.replace(/^[\\s\"'“”‘’(\u003c\\[]+|[\\s\"'“”‘’)\u003e\\],;，。]+$/g, '');\n        if (/^data:image\\//i.test(u)) return u;\n        if (/^\\/\\//.test(u)) return 'https:' + u;\n        if (/^https?:\\/\\//i.test(u)) return u;\n        if (/^[\\w-]+(\\.[\\w-]+)+(:\\d+)?(\\/|$)/.test(u)) return 'https://' + u;\n        return '';\n    }\n    function imageUrls(m) { return splitLines(m.content).map(normImgUrl).filter(Boolean); }\n    // 预览用图片地址：http 升级为 https（避免混合内容被拦截），失败时回退到原地址；并关闭 Referer 以绕过防盗链\n    function setPreviewImage(im, url) {\n        const shown = url.replace(/^http:\\/\\//i, 'https://');\n        im.setAttribute('referrerpolicy', 'no-referrer');\n        im.setAttribute('data-fallback-src', url !== shown ? url : '');\n        im.setAttribute('onerror', \"this.onerror=null;var f=this.getAttribute('data-fallback-src');if(f)this.src=f;\");\n        im.setAttribute('src', shown);\n        im.removeAttribute('srcset');\n        im.removeAttribute('loading');\n    }\n\n    // 文案：从所选文案名称中随机读取一批（固定 COPY_POOL_SIZE 条），实际展示条数由【数量】控件决定\n    function drawCopy() {\n        const m = findById(appData.files.text, ui.copyModuleId);\n        if (!m) { ui.copyLines = []; return; }\n        const n = COPY_POOL_SIZE;\n        ui.copyLines = sampleN(splitEntries(m.content), n);\n        ui.douyinBg = '';   // 重新取文案时，抖音版背景图也重新随机\n    }\n    // 配图：随机选一个配图条目，再从中随机取 20 项作为备选\n    function drawImagePool() {\n        const mods = appData.files.image.filter(m =\u003e imageUrls(m).length \u0026\u0026 !/抖音背景/.test(m.name || ''));\n        if (!mods.length) { ui.imgModuleId = null; ui.imgPool = []; return; }\n        const m = mods[Math.floor(Math.random() * mods.length)];\n        ui.imgModuleId = m.id;\n        ui.imgPool = sampleN(imageUrls(m), IMG_POOL_SIZE);\n    }\n    // 数据变化（如在【我的】里修改后）时，校验已选内容仍然存在\n    function validateSelections() {\n        const cm = findById(appData.files.text, ui.copyModuleId);\n        if (!cm) {\n            ui.copyModuleId = null; ui.copyLines = [];\n        } else {\n            const cur = new Set(splitEntries(cm.content));\n            ui.copyLines = (ui.copyLines || []).filter(l =\u003e cur.has(l));\n            if (!ui.copyLines.length) drawCopy();\n        }\n        const im = findById(appData.files.image, ui.imgModuleId);\n        const urls = im ? new Set(imageUrls(im)) : new Set();\n        ui.imgPool = (ui.imgPool || []).filter(u =\u003e urls.has(u));\n        if (!ui.imgPool.length) drawImagePool();\n        if (!findById(appData.files.gif, ui.gifId)) ui.gifId = null;\n        if (ui.historyId != null \u0026\u0026 !findById(appData.history, ui.historyId)) { ui.historyId = null; ui.historyHtml = ''; }\n        if (!ui.historyHtml) ui.mediaOrder = (ui.mediaOrder || []).filter(k =\u003e k !== 'history');\n        saveUiState();\n    }\n\n    // 默认添加：emoji、动图随机，往期默认文字版；抖音版不添加\n    function clearAllMedia() {\n        ui.previewEmoji = ''; ui.gifId = null; ui.gifContentOverride = '';\n        ui.historyHtml = ''; ui.historyId = null; ui.mediaOrder = [];\n    }\n    function applyDefaultMedia() {\n        const emo = (appData.emoji || []);\n        if (!ui.previewEmoji \u0026\u0026 emo.length) {\n            const v = randomBlock(emo[Math.floor(Math.random() * emo.length)].content || '');\n            if (v) ui.previewEmoji = v;\n        }\n        const gifs = (appData.files.gif || []);\n        if (ui.gifId == null \u0026\u0026 gifs.length) {\n            const g = gifs[Math.floor(Math.random() * gifs.length)];\n            const v = randomBlock(g.content || '');\n            if (v) { ui.gifId = g.id; ui.gifContentOverride = v; }\n        }\n        const hs = (appData.history || []);\n        if (!ui.historyHtml \u0026\u0026 hs.length) {\n            const h = hs.find(x =\u003e /文字/.test(x.name || '')) || hs[0];\n            ui.historyId = h.id; ui.historyHtml = composeHistoryHtml(h);\n        }\n        ui.mediaOrder = [];\n        if (ui.gifId != null) ui.mediaOrder.push('gif');\n        if (ui.historyHtml) ui.mediaOrder.push('history');\n        return !!(emo.length || gifs.length || hs.length);   // 数据还没加载好时返回 false，等数据到位后再补\n    }\n    function initFromData() {\n        validateSelections();\n        if (!ui.mediaInit) {\n            if (layoutKind() === 'douyin') { clearAllMedia(); ui.mediaDy = true; ui.mediaInit = true; }\n            else if (applyDefaultMedia()) ui.mediaInit = true;\n            saveUiState();\n        }\n        switchMainTab(VALID_TABS.includes(ui.tab) ? ui.tab : 'copy');\n        updatePreview();\n    }\n\n    // 跳转【我的】完整页面\n    function goMyPage() {\n        saveUiState();\n        if (window.parent !== window \u0026\u0026 parent.showView) parent.showView('my');\n        else location.href = MY_PAGE_URL;\n    }\n\n    // 从【我的】返回时由外壳调用：重新读取数据并刷新当前面板与预览\n    function refreshFromStorage() {\n        appData = loadAppData();\n        initFromData();\n    }\n\n    // 切换一级导航\n    function switchMainTab(tabName) {\n        ui.tab = tabName;\n        saveUiState();\n        document.querySelectorAll('.main-nav-item[data-tab]').forEach(btn =\u003e btn.classList.toggle('active', btn.dataset.tab === tabName));\n\n        const subNav = document.getElementById('subNav');\n        const secondRow = document.getElementById('secondRow');\n        const hasSub = tabName === 'copy' || tabName === 'more';\n        subNav.style.display = hasSub ? 'flex' : 'none';\n        secondRow.classList.toggle('grid-mode', hasSub);\n\n        if (tabName === 'account') renderAccountTab();\n        else if (tabName === 'layout') renderLayoutTab();\n        else if (tabName === 'copy') renderCopySubNav();\n        else if (tabName === 'more') renderMoreSubNav();\n    }\n\n    // 1. 渲染账号面板（与【我的】账号条目一一对应）\n    function renderAccountTab() {\n        const secondRow = document.getElementById('secondRow');\n        const accs = appData.accounts;\n        let idx = accs.findIndex(a =\u003e String(a.id) === String(ui.accountId));\n        if (idx \u003c 0) idx = 0;\n        secondRow.innerHTML = accs.map((acc, i) =\u003e `\n                \u003cdiv class=\"account-item ${i === idx ? 'active' : ''}\" onclick=\"selectAccount(${i}, this)\" title=\"${esc(acc.name)}\"\u003e\n                    \u003csvg viewBox=\"0 0 24 24\"\u003e${ACCOUNT_ICONS[i % ACCOUNT_ICONS.length]}\u003c/svg\u003e\n                    \u003cspan\u003e${esc(acc.name)}\u003c/span\u003e\n                \u003c/div\u003e\n            `).join('') || emptyTip('暂无账号，请到【我的】中添加');\n    }\n    function selectAccount(index, element) {\n        document.querySelectorAll('.account-item').forEach(el =\u003e el.classList.remove('active'));\n        element.classList.add('active');\n        if (appData.accounts[index]) { ui.accountId = appData.accounts[index].id; saveUiState(); updatePreview(); }\n    }\n\n    // 2. 渲染版式面板（与【我的】版式条目一一对应）\n    function renderLayoutTab() {\n        const secondRow = document.getElementById('secondRow');\n        const cur = getLayoutIndex();\n        secondRow.innerHTML = appData.layout.map((item, i) =\u003e {\n            const t = thumbFor(item.name, i);\n            return `\n                \u003cdiv class=\"layout-item ${i === cur ? 'active' : ''}\" onclick=\"selectLayout(${i}, this)\" title=\"${esc(item.name)}\"\u003e\n                    \u003cdiv class=\"layout-card\"\u003e\n                        \u003cdiv class=\"layout-text-top\" style=\"background-color: ${t.color};\"\u003e${esc(shortName(item.name))}\u003c/div\u003e\n                        \u003cdiv class=\"layout-img-bottom\" style=\"background-image: url('${t.bg}')\"\u003e\u003c/div\u003e\n                    \u003c/div\u003e\n                \u003c/div\u003e\n            `;\n        }).join('') || emptyTip('暂无版式，请到【我的】中添加');\n    }\n\n    function selectLayout(index, element) {\n        document.querySelectorAll('.layout-item').forEach(el =\u003e el.classList.remove('active'));\n        element.classList.add('active');\n        ui.layoutId = appData.layout[index].id;\n        if (layoutKind() === 'douyin') { clearAllMedia(); ui.mediaDy = true; }\n        else if (ui.mediaDy) { ui.mediaDy = false; applyDefaultMedia(); }\n        saveUiState();\n        updatePreview();\n        if (ui.tab === 'more') renderMoreItems();\n    }\n\n    // 3. 数量控件（位于【文案】模块顶部右侧，逻辑与原【数量】导航一致）\n    function quantityControlHtml() {\n        const q = ui.quantity;\n        const chip = n =\u003e `\u003cbutton class=\"qty-chip ${q === n ? 'active' : ''}\" data-n=\"${n}\" onclick=\"selectQuantity(${n})\"\u003e${n}\u003c/button\u003e`;\n        return `\u003cspan class=\"qty-ctrl\"\u003e${[3, 6, 9].map(chip).join('')}\u003cinput id=\"qtyInput\" class=\"qty-input\" type=\"number\" min=\"1\" max=\"15\" value=\"${q}\" placeholder=\"自定义\" oninput=\"selectCustomQuantity(this)\" /\u003e\u003cbutton id=\"mulBtn\" class=\"qty-chip\" style=\"color:var(--theme);border-color:var(--theme);\" onclick=\"cycleMultiplier()\" title=\"倍率：每条文案的句数\"\u003ex${ui.multiplier || 1}\u003c/button\u003e\u003c/span\u003e`;\n    }\n\n    function syncQuantityUI(skipInput) {\n        document.querySelectorAll('.qty-chip').forEach(el =\u003e el.classList.toggle('active', Number(el.dataset.n) === ui.quantity));\n        const inp = document.getElementById('qtyInput');\n        if (inp \u0026\u0026 !skipInput) inp.value = ui.quantity;\n    }\n\n    // 倍率：x1~x5 循环；xN = 每个文案条目共 N 句，额外的句子用两个换行分隔追加\n    function cycleMultiplier() {\n        ui.multiplier = ((ui.multiplier || 1) % 5) + 1;\n        saveUiState();\n        const b = document.getElementById('mulBtn');\n        if (b) b.textContent = 'x' + ui.multiplier;\n        updatePreview();\n    }\n\n    function selectQuantity(num) {\n        ui.quantity = num;\n        saveUiState();\n        syncQuantityUI(false);\n        updatePreview();\n    }\n\n    function selectCustomQuantity(input) {\n        let val = parseInt(input.value);\n        if (val \u003e 0) {\n            ui.quantity = val;\n            saveUiState();\n            syncQuantityUI(true);\n            updatePreview();\n        }\n    }\n\n    // ---------- 预览 ----------\n    function pad2(n) { return String(n).padStart(2, '0'); }\n    const TEXT_SKIP = /^(PART|[“”\"'‘’「」『』]+)$/;\n\n    // 往一个版式单元里填入文案 / 配图（line、img 为 null 时保留原样）\n    function layoutKind() {\n        const lo = appData.layout[getLayoutIndex()];\n        const n = (lo \u0026\u0026 lo.name) || '';\n        if (/卡片/.test(n)) return 'card';\n        if (/断章|序引/.test(n)) return 'duan';\n        if (/朋友圈/.test(n)) return 'moments';\n        if (/断句/.test(n)) return 'sentence';\n        if (/抖音/.test(n)) return 'douyin';\n        return '';\n    }\n    function currentAccount() {\n        const accs = appData.accounts || [];\n        return findById(accs, ui.accountId) || accs[0] || null;\n    }\n    // 倍率：把额外文案追加到各版式指定的容器内，使用两个换行符分隔\n    function appendExtras(node, extras) {\n        if (!node || !extras || !extras.length) return;\n        const kind = layoutKind();\n        const styleOf = e =\u003e e.getAttribute('style') || '';\n        const find = test =\u003e { for (let e = node.parentElement; e; e = e.parentElement) { if (test(e)) return e; } return null; };\n        let host = null;\n        if (kind === 'card') host = find(e =\u003e /overflow-wrap\\s*:\\s*anywhere/i.test(styleOf(e)));\n        else if (kind === 'moments') host = find(e =\u003e /white-space\\s*:\\s*pre-wrap/i.test(styleOf(e)));\n        else if (kind === 'duan' || kind === 'sentence') host = find(e =\u003e e.hasAttribute('leaf'));\n        if (!host) host = node.parentElement;\n        if (!host) return;\n        const pre = /white-space\\s*:\\s*pre/i.test(styleOf(host));\n        extras.forEach(t =\u003e {\n            if (pre) host.appendChild(document.createTextNode('\\n\\n' + t));\n            else {\n                host.appendChild(document.createElement('br'));\n                host.appendChild(document.createElement('br'));\n                host.appendChild(document.createTextNode(t));\n            }\n        });\n    }\n    // 朋友圈版：内容图片显示为正方形（头像除外）\n    function squareMomentImages(nodes) {\n        if (layoutKind() !== 'moments') return;\n        nodes.forEach(root =\u003e {\n            const imgs = root.tagName === 'IMG' ? [root] : Array.from(root.querySelectorAll('img'));\n            imgs.forEach(im =\u003e {\n                const w = /width:\\s*(\\d+)px/.exec(im.getAttribute('style') || '');\n                if (w \u0026\u0026 parseInt(w[1]) \u003c= 64) return;\n                im.style.setProperty('aspect-ratio', '1 / 1', 'important');\n                im.style.setProperty('object-fit', 'cover', 'important');\n                im.style.setProperty('height', w ? w[1] + 'px' : 'auto', 'important');\n            });\n        });\n    }\n    // 朋友圈版：头像取自当前选中账号（微信头像链接），失败时回退到版式自带头像\n    function applyAccountAvatar(nodes) {\n        if (layoutKind() !== 'moments') return;\n        const acc = currentAccount();\n        let url = acc ? String(acc.avatar || '').trim() : '';\n        if (!/^(https?:)?\\/\\//i.test(url) \u0026\u0026 !/^data:image\\//i.test(url)) return;\n        url = url.replace(/^http:\\/\\/((?:thirdwx\\.|wx\\.)?qlogo\\.cn)/i, 'https://$1');\n        nodes.forEach(root =\u003e {\n            const imgs = root.tagName === 'IMG' ? [root] : Array.from(root.querySelectorAll('img'));\n            imgs.forEach(im =\u003e {\n                const w = /width:\\s*(\\d+)px/.exec(im.getAttribute('style') || '');\n                if (!(w \u0026\u0026 parseInt(w[1]) \u003c= 64)) return;\n                im.setAttribute('data-fallback-src', im.getAttribute('src') || '');\n                im.setAttribute('referrerpolicy', 'no-referrer');\n                im.setAttribute('onerror', \"this.onerror=null;var f=this.getAttribute('data-fallback-src');if(f)this.src=f;\");\n                im.setAttribute('src', url);\n                im.removeAttribute('srcset');\n            });\n        });\n    }\n\n    // 解析“正文 —— 出处”：破折号（——/—/―/--）之后的短文本视为出处\n    function parseSource(line) {\n        const s = String(line == null ? '' : line).trim();\n        const chars = Array.from(s);\n        const isDash = c =\u003e /[—―─－–]/.test(c);\n        // 句尾 20 字以内出现破折号（—— / — / ― / ─ / －，及连续两个以上的 -）即视为有出处，破折号之后为出处\n        const lo = Math.max(0, chars.length - 21);\n        for (let k = lo; k \u003c chars.length; k++) {\n            let dash = isDash(chars[k]) || (chars[k] === '-' \u0026\u0026 chars[k + 1] === '-');\n            if (!dash) continue;\n            let e = k;\n            while (e \u003c chars.length \u0026\u0026 (isDash(chars[e]) || chars[e] === '-')) e++;\n            const src = chars.slice(e).join('').trim();\n            const body = chars.slice(0, k).join('').replace(/\\s+$/, '');\n            if (src \u0026\u0026 body \u0026\u0026 chars.length - e \u003c= 20) return { body, source: src };\n        }\n        return { body: s, source: '' };\n    }\n    const charLen = s =\u003e Array.from(String(s || '')).length;\n    // 各版式固定的出处模板（朋友圈不展示出处）\n    function sourceTemplate(kind, text) {\n        const t = esc(text);\n        if (kind === 'sentence') return `\u003cspan style=\"display:block!important;width:100%!important;margin:0!important;padding:0!important;\"\u003e\u003cspan leaf=\"\"\u003e${t}\u003c/span\u003e\u003c/span\u003e`;\n        if (kind === 'card') return `\u003cdiv style=\"width:100%;max-width:100%;margin:14px 0 0 0;padding:0;border:0;color:#999999;font-size:13px;line-height:2.1;overflow-wrap:anywhere;\"\u003e${t}\u003c/div\u003e`;\n        if (kind === 'duan') return `\u003cp style=\"margin: 0px; padding: 0px; box-sizing: border-box; visibility: visible;\"\u003e\u003cstrong style=\"box-sizing: border-box; visibility: visible;\"\u003e\u003cspan leaf=\"\" style=\"visibility: visible;\"\u003e${t}\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e`;\n        return '';\n    }\n    function applySource(srcNode, source) {\n        const kind = layoutKind();\n        if (!srcNode) return;\n        const up = test =\u003e { for (let e = srcNode.parentElement; e; e = e.parentElement) { if (test(e)) return e; } return null; };\n        let host = null;\n        if (kind === 'sentence') host = up(e =\u003e e.tagName === 'SPAN' \u0026\u0026 /display\\s*:\\s*block/i.test(e.getAttribute('style') || ''));\n        else if (kind === 'card') host = up(e =\u003e e.tagName === 'DIV' \u0026\u0026 /overflow-wrap/i.test(e.getAttribute('style') || ''));\n        else if (kind === 'duan') host = up(e =\u003e e.tagName === 'P');\n        if (!host) { srcNode.nodeValue = ''; return; }\n        if (kind === 'moments' || !source) {\n            // 无出处 / 朋友圈：移除出处元素（断章序引同时移除其上方的空白占位行）\n            if (kind === 'duan') {\n                const prev = host.previousElementSibling;\n                if (prev \u0026\u0026 prev.tagName === 'P' \u0026\u0026 !(prev.textContent || '').trim() \u0026\u0026 prev.querySelector('br')) prev.remove();\n            }\n            host.remove();\n            return;\n        }\n        const tpl = document.createElement('template');\n        tpl.innerHTML = sourceTemplate(kind, source);\n        host.replaceWith(tpl.content.firstElementChild);\n    }\n\n    // 写入正文；条目内含换行时用 \u003cbr\u003e 保留，返回最后一个文本节点\n    function setBodyText(node, text) {\n        const parts = String(text).split('\\n');\n        node.nodeValue = parts[0];\n        let last = node;\n        for (let k = 1; k \u003c parts.length; k++) {\n            const br = document.createElement('br');\n            last.parentNode.insertBefore(br, last.nextSibling);\n            const tn = document.createTextNode(parts[k]);\n            br.parentNode.insertBefore(tn, br.nextSibling);\n            last = tn;\n        }\n        return last;\n    }\n\n    function fillUnit(nodes, i, line, img, extras) {\n        const texts = [];\n        nodes.forEach(root =\u003e {\n            const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);\n            let n;\n            while ((n = w.nextNode())) { if (n.nodeValue.trim()) texts.push(n); }\n        });\n        const cands = [];\n        texts.forEach(n =\u003e {\n            const t = n.nodeValue.trim();\n            if (/^\\d{1,3}$/.test(t)) { if (line != null) n.nodeValue = n.nodeValue.replace(t, pad2(i + 1)); }\n            else if (/^\\d+分钟前$/.test(t)) { if (line != null) n.nodeValue = n.nodeValue.replace(t, (i + 1) + '分钟前'); }\n            else if (!TEXT_SKIP.test(t)) cands.push(n);\n        });\n        if (line != null \u0026\u0026 cands.length) {\n            let qi = -1, max = -1;\n            cands.forEach((n, idx) =\u003e {\n                const t = n.nodeValue.trim();\n                if (t.includes('《')) return;\n                if (t.length \u003e max) { max = t.length; qi = idx; }\n            });\n            if (qi \u003c 0) qi = 0;\n            const srcNode = cands[qi + 1];\n            // 朋友圈版：不单独渲染出处模板，破折号及其后的出处直接跟随正文；其余版式：正文 + 各自的出处模板\n            const bodyText = layoutKind() === 'moments' ? line.full : line.body;\n            const lastNode = setBodyText(cands[qi], bodyText);\n            if (srcNode) applySource(srcNode, line.source);\n            appendExtras(lastNode, extras);\n        }\n        if (img) {\n            nodes.forEach(root =\u003e {\n                const imgs = root.tagName === 'IMG' ? [root] : Array.from(root.querySelectorAll('img'));\n                imgs.forEach(im =\u003e {\n                    const w = /width:\\s*(\\d+)px/.exec(im.getAttribute('style') || '');\n                    if (w \u0026\u0026 parseInt(w[1]) \u003c= 64) return; // 头像不替换\n                    setPreviewImage(im, img);\n                });\n            });\n        }\n    }\n\n    // 抖音版背景图：从 配图「000_抖音背景图」里随机取 1 张（同一批文案内保持不变，重新取文案时重新随机）\n    function douyinBgUrl() {\n        const urls = [];\n        (appData.files.image || []).forEach(m =\u003e { if (/抖音背景/.test(m.name || '')) imageUrls(m).forEach(u =\u003e urls.push(u)); });\n        if (!urls.length) return '';\n        if (!ui.douyinBg || !urls.includes(ui.douyinBg)) { ui.douyinBg = urls[Math.floor(Math.random() * urls.length)]; saveUiState(); }\n        return ui.douyinBg;\n    }\n    // 抖音版：整张卡片只有 1 个，背景图随机替换；已选文案全部放进「文案」位置（多条时每条一个 \u003cp style=\"margin:0;\"\u003e）\n    function buildDouyin(content) {\n        const out = document.createElement('div');\n        out.style.cssText = 'width:100%; margin:0; padding:0; background:#ffffff; box-sizing:border-box;';\n        out.innerHTML = content || '';\n        out.querySelectorAll('script').forEach(s =\u003e s.remove());\n        const bg = douyinBgUrl();\n        if (bg) {\n            const els = Array.from(out.querySelectorAll('[data-lazy-bgimg]'));\n            const el = els.find(e =\u003e /cKZHCJzxwWMjEHl3Nfrx/.test(e.getAttribute('data-lazy-bgimg') || '')) || els.find(e =\u003e e.tagName === 'SECTION');\n            if (el) {\n                el.setAttribute('data-lazy-bgimg', bg);\n                el.style.setProperty('background-image', 'url(\"' + bg + '\")');\n            }\n        }\n        const copy = ui.copyLines || [];\n        if (copy.length) {\n            const total = Math.min(Math.max(1, ui.quantity || 1), copy.length);\n            const ordered = copy.slice(0, total).map((l, idx) =\u003e Object.assign(parseSource(l), { idx, full: l }))\n                .sort((a, b) =\u003e charLen(a.body) - charLen(b.body) || a.idx - b.idx);\n            const span = Array.from(out.querySelectorAll('span[leaf]')).find(sp =\u003e sp.textContent.trim() === '文案');\n            if (span) {\n                const p = span.closest('p');\n                if (ordered.length === 1) setBodyText(span.firstChild, ordered[0].full);\n                else if (p \u0026\u0026 p.parentNode) {\n                    ordered.forEach(o =\u003e {\n                        const e = document.createElement('p');\n                        e.setAttribute('style', 'margin:0;');\n                        o.full.split('\\n').forEach((ln, k) =\u003e { if (k) e.appendChild(document.createElement('br')); e.appendChild(document.createTextNode(ln)); });\n                        p.parentNode.insertBefore(e, p);\n                    });\n                    p.remove();\n                }\n            }\n        }\n        if (out.firstElementChild) out.firstElementChild.setAttribute('data-unit', '0');\n        out.setAttribute('data-douyin', 'true');\n        return out;\n    }\n\n    // 渲染所选版式：按「数量」截取/重复版式单元，并填入已选文案、配图\n    function buildPreview(content, count) {\n        if (layoutKind() === 'douyin') return buildDouyin(content);\n        const tpl = document.createElement('template');\n        tpl.innerHTML = content || '';\n        tpl.content.querySelectorAll('script').forEach(s =\u003e s.remove());\n        const top = Array.from(tpl.content.children);\n        const styles = top.filter(e =\u003e e.tagName === 'STYLE');\n        let nodes = top.filter(e =\u003e e.tagName !== 'STYLE');\n\n        // 重复单元（按标签序列的最小周期）\n        const periodOf = list =\u003e {\n            const n = list.length;\n            for (let p = 1; p \u003c= n; p++) {\n                if (n % p) continue;\n                let ok = true;\n                for (let i = 0; i \u003c n; i++) if (list[i].tagName !== list[i % p].tagName) { ok = false; break; }\n                if (ok) return p;\n            }\n            return n;\n        };\n        let wrapper = null;\n        if (nodes.length === 1) {\n            const kids = Array.from(nodes[0].children).filter(e =\u003e e.tagName !== 'STYLE');\n            // 单个外层容器：内部只有 1 个单元 / 或由重复单元构成 → 外层作为容器，内部单元重复；否则整个节点就是一个单元\n            if (kids.length === 1 || (kids.length \u003e= 2 \u0026\u0026 periodOf(kids) \u003c kids.length)) { wrapper = nodes[0]; nodes = kids; }\n        }\n        const n = nodes.length;\n        const k = n ? periodOf(nodes) : 0;\n        const unitList = [];\n        for (let i = 0; i + k \u003c= n \u0026\u0026 k \u003e 0; i += k) unitList.push(nodes.slice(i, i + k));\n        if (!unitList.length) unitList.push(nodes);\n\n        const copy = ui.copyLines || [];\n        const pool = ui.imgPool || [];\n        const hasCopy = copy.length \u003e 0;\n        const q = Math.max(1, count);\n        const total = hasCopy ? Math.min(q, copy.length) : Math.min(q, unitList.length);\n\n        // 选中文案集合后，按字符数量由少到多排序（正文字数，不含出处），预览按此顺序输出\n        const ordered = hasCopy\n            ? copy.slice(0, total).map((l, idx) =\u003e Object.assign(parseSource(l), { idx, full: l })).sort((a, b) =\u003e charLen(a.body) - charLen(b.body) || a.idx - b.idx)\n            : [];\n        const out = document.createElement('div');\n        let host = out;\n        if (wrapper) {\n            host = wrapper.cloneNode(false);\n            out.appendChild(host);\n        } else {\n            out.style.cssText = 'width:100%; margin:0; padding:0; background:#ffffff; box-sizing:border-box;';\n        }\n        styles.forEach(st =\u003e host.appendChild(st.cloneNode(true)));\n        for (let i = 0; i \u003c total; i++) {\n            const clones = unitList[i % unitList.length].map(e =\u003e e.cloneNode(true));\n            const mul = Math.max(1, Math.min(5, ui.multiplier || 1));\n            const extras = [];\n            if (hasCopy) for (let j = 1; j \u003c mul; j++) { const ex = copy[(total * j + i) % copy.length]; extras.push(layoutKind() === 'moments' ? ex : parseSource(ex).body); }\n            fillUnit(clones, i, hasCopy ? ordered[i] : null, pool.length ? pool[i % pool.length] : null, extras);\n            applyAccountAvatar(clones);\n            squareMomentImages(clones);\n            clones.forEach(e =\u003e { if (e.nodeType === 1) e.setAttribute('data-unit', i); });\n            if (i \u003c total - 1) {   // 每个版式的条目之间统一 25px\n                for (let q2 = clones.length - 1; q2 \u003e= 0; q2--) {\n                    if (clones[q2].nodeType === 1) { clones[q2].style.setProperty('margin-bottom', '25px', 'important'); break; }\n                }\n            }\n            if (i === total - 1) trimTrailingSpace(clones);\n            clones.forEach(e =\u003e host.appendChild(e));\n        }\n        if (ui.previewEmoji) appendEmojiToNumbers(host, ui.previewEmoji);\n        return out;\n    }\n\n    // 最后一个条目去掉尾部间距（含断章序引末尾的空白占位段落），让往期 / 动图的上边距直接决定块间距\n    function trimTrailingSpace(clones) {\n        const els = clones.filter(e =\u003e e.nodeType === 1);\n        const last = els[els.length - 1];\n        if (!last) return;\n        last.style.setProperty('margin-bottom', '0', 'important');\n        if (layoutKind() === 'duan') {\n            const ps = last.querySelectorAll(':scope \u003e p');\n            const tail = ps[ps.length - 1];\n            if (tail \u0026\u0026 !(tail.textContent || '').trim() \u0026\u0026 tail.querySelector('br')) tail.style.setProperty('display', 'none', 'important');\n        }\n    }\n\n    function appendEmojiToNumbers(root, value) {\n        if (!value || !root) return;\n        const layout = appData.layout[getLayoutIndex()];\n        const name = layout ? (layout.name || '') : '';\n        const makeEmoji = () =\u003e {\n            const span = document.createElement('span');\n            span.setAttribute('data-preview-emoji', 'true');\n            // 固定使用 4 个半角空格；整体盒模型宽度不超过 10px、高度不超过 5px。\n            span.textContent = '    ' + value;\n            span.style.cssText = 'display:inline-block;width:1px;min-width:0;max-width:1px;height:1px;max-height:1px;overflow:hidden;vertical-align:middle;white-space:pre;word-break:normal;font-size:4px;line-height:5px;box-sizing:border-box;padding:0;margin:0;';\n            return span;\n        };\n        const addInside = (target) =\u003e {\n            if (!target || target.querySelector(':scope \u003e [data-preview-emoji=\"true\"]')) return;\n            target.appendChild(makeEmoji());\n        };\n        if (/朋友圈/.test(name)) {\n            const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT);\n            const targets = [  return div;\n    }\n\n    // 更新预览：[动图] + 版式（含文案/配图） + [往期]\n    // 往期 / 动图边距（上、右、下、左）。默认值按当前版式；用户修改后按版式分别记忆\n    function marginDefaults() {\n        const k = layoutKind();\n        if (k === 'moments') return [25, 25, 0, 55];\n        if (k === 'duan') return [16, 15, 16, 15];   // 上/下沿用原有 16，左右 15\n        return [16, 0, 16, 0];\n    }\n    function getMargins() {\n        const v = ui.margins \u0026\u0026 ui.margins[layoutKind() || 'default'];\n        return Array.isArray(v) \u0026\u0026 v.length === 4 ? v : marginDefaults();\n    }\n    // 往期 / 动图模块共用边距：上右下左。左右相对预览容器边界（增大则宽度压缩），上下控制与相邻内容块的间距\n    function setMargin(el, arr) {\n        ['top', 'right', 'bottom', 'left'].forEach((s, i) =\u003e el.style.setProperty('margin-' + s, (parseFloat(arr[i]) || 0) + 'px', 'important'));\n    }\n    function marginCss(arr) { return arr.map(n =\u003e (isFinite(parseFloat(n)) \u0026\u0026 parseFloat(n) \u003e= 0 ? parseFloat(n) : 0) + 'px').join(' '); }\n\n    // 全局空行：以【鼠标选中行 / 光标所在行】为基准，在该行上方 / 下方各插入一个空行；全局首行上方、末行下方不支持\n    function makeBlankLine(pos) {\n        const d = document.createElement('div');\n        d.setAttribute('data-blank-line', pos);\n        d.style.cssText = 'height:1.8em;line-height:1.8em;';\n        d.appendChild(document.createElement('br'));\n        return d;\n    }\n    const BLOCKISH = /^(block|flex|grid|list-item|flow-root|table)$/;\n    function lineElementFrom(node) {\n        const area = document.getElementById('previewArea');\n        let el = node \u0026\u0026 (node.nodeType === 1 ? node : node.parentElement);\n        if (!el || !area.contains(el) || el === area || el.closest('[data-blank-line]')) return null;\n        while (el \u0026\u0026 el !== area) {\n            if (/^(TD|TH|TR|TBODY|THEAD|TFOOT)$/.test(el.tagName)) { el = el.closest('table') || el; }\n            if (BLOCKISH.test(getComputedStyle(el).display)) break;\n            el = el.parentElement;\n        }\n        if (!el || el === area) return null;\n        // 位于 flex /
