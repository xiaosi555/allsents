cEditPanel() {\n        const arr = getMargins();\n        for (let i = 0; i \u003c 4; i++) {\n            const el = document.getElementById('m_' + i);\n            if (el \u0026\u0026 document.activeElement !== el) el.value = arr[i];\n        }\n        [['blankTopBtn', ui.blankTop], ['blankBottomBtn', ui.blankBottom]].forEach(([id, on]) =\u003e {\n            const b = document.getElementById(id); b.classList.toggle('on', !!on); b.textContent = on ? '开' : '关';\n        });\n        updateAnchorLabel();\n    }\n    function toggleBlank(pos) {\n        const sel = window.getSelection();\n        const fromSel = sel \u0026\u0026 sel.anchorNode ? lineElementFrom(sel.anchorNode) : null;\n        if (fromSel) ui.blankAnchor = { path: linePath(fromSel) };\n        const a = ui.blankAnchor;\n        if (!(a \u0026\u0026 Array.isArray(a.path) \u0026\u0026 lineFromPath(a.path))) { updateAnchorLabel(); return; }   // 还没选中任何行\n        if (pos === 'top') ui.blankTop = !ui.blankTop; else ui.blankBottom = !ui.blankBottom;\n        saveUiState();\n        applyBlankLines(document.getElementById('previewArea'));\n        syncEditPanel();\n        updatePreviewCharCount();\n    }\n\n    // 随机文章标题：跟随当前所选文案（如选中“短句”，则读取“短句”下的标题）；以单个换行符分割，剔除空行\n    let lastTitle = '';\n    function titleSourceModules() {\n        const sel = findById(appData.files.text, ui.copyModuleId);\n        if (sel) return [sel];\n        return (appData.files.text || []).filter(t =\u003e (t.category || '朋友圈') === ui.textCat);\n    }\n    function loadRandomTitle() {\n        const mods = titleSourceModules();\n        const titles = [];\n        mods.forEach(t =\u003e String(t.title || '').split('\\n').map(s =\u003e s.replace(/\\r/g, '').trim()).filter(Boolean).forEach(s =\u003e titles.push(s)));\n        const box = document.getElementById('titleText');\n        if (!titles.length) {\n            box.textContent = mods.length === 1 ? '所选文案「' + (mods[0].name || '') + '」暂无标题，请到【我的】-文案中填写标题。' : '暂无标题，请先选择文案，并到【我的】-文案中填写标题。';\n            lastTitle = ''; return;\n        }\n        let pick = titles[Math.floor(Math.random() * titles.length)];\n        if (titles.length \u003e 1) { let guard = 0; while (pick === lastTitle \u0026\u0026 guard++ \u003c 10) pick = titles[Math.floor(Math.random() * titles.length)]; }\n        lastTitle = pick; box.textContent = '\\u201c' + pick.replace(/^[\\u201c\\u201d\\\"]+|[\\u201c\\u201d\\\"]+$/g, '') + '\\u201d';\n    }\n    async function copyTitle() {\n        const text = document.getElementById('titleText').textContent;\n        if (!lastTitle) return;\n        const btn = document.getElementById('copyTitleBtn');\n        try { await navigator.clipboard.writeText(text); }\n        catch (e) {\n            const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;';\n            document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (_) {} ta.remove();\n        }\n        btn.textContent = '已复制'; setTimeout(() =\u003e { btn.textContent = '复制'; }, 1200);\n    }\n\n    // 抖音版：取整张卡片（背景图、圆角、全部文案和图标）作为富文本，浏览器自带的选区复制会丢掉背景图\n    function douyinCopyPayload() {\n        const root = document.querySelector('#previewArea [data-douyin]');\n        if (!root) return null;\n        const c = root.cloneNode(true);\n        c.querySelectorAll('[data-unit]').forEach(e =\u003e e.removeAttribute('data-unit'));\n        c.removeAttribute('data-unit'); c.removeAttribute('data-douyin');\n        return { html: c.innerHTML, text: root.innerText };\n    }\n    document.addEventListener('copy', e =\u003e {\n        const sel = window.getSelection();\n        const dy = document.querySelector('#previewArea [data-douyin]');\n        if (!dy || !sel || sel.isCollapsed || !e.clipboardData) return;\n        if (!(dy.contains(sel.anchorNode) || dy.contains(sel.focusNode))) return;\n        const p = douyinCopyPayload();\n        if (!p) return;\n        e.clipboardData.setData('text/html', p.html);\n        e.clipboardData.setData('text/plain', p.text);\n        e.preventDefault();\n    });\n\n    // 复制预览区「渲染后的可视内容」（等同于全选后复制，粘贴得到富文本，而不是 HTML 源码）\n    async function copyPreviewContent() {\n        const area = document.getElementById('previewArea');\n        const btn = document.getElementById('copyPreviewBtn');\n        const done = txt =\u003e { if (btn) { btn.textContent = txt; clearTimeout(btn._t); btn._t = setTimeout(() =\u003e { btn.textContent = '复制预览内容'; }, 1400); } };\n        if (!area || !area.childNodes.length) { done('暂无内容'); return; }\n        const dyp = douyinCopyPayload();\n        if (dyp) {   // 抖音版：整张卡片（含背景图）\n            let ok = false;\n            try {\n                await navigator.clipboard.write([new ClipboardItem({\n                    'text/html': new Blob([dyp.html], { type: 'text/html' }),\n                    'text/plain': new Blob([dyp.text], { type: 'text/plain' })\n                })]);\n                ok = true;\n            } catch (e) {\n                try {\n                    const h = ev =\u003e { ev.clipboardData.setData('text/html', dyp.html); ev.clipboardData.setData('text/plain', dyp.text); ev.preventDefault(); };\n                    document.addEventListener('copy', h, { once: true });\n                    ok = document.execCommand('copy');\n                } catch (_) { ok = false; }\n            }\n            done(ok ? '已复制' : '复制失败，请长按选中后复制');\n            return;\n        }\n        const sel = window.getSelection();\n        const range = document.createRange();\n        area.classList.add('copying');\n        let ok = false;\n        try {\n            range.selectNodeContents(area);\n            sel.removeAllRanges();\n            sel.addRange(range);\n            ok = document.execCommand('copy');\n        } catch (e) { ok = false; }\n        if (!ok) {   // 兜底：以富文本（text/html）+ 纯文本写入剪贴板，仍然是渲染后的内容\n            try {\n                const html = area.innerHTML, text = area.innerText;\n                await navigator.clipboard.write([new ClipboardItem({\n                    'text/html': new Blob([html], { type: 'text/html' }),\n                    'text/plain': new Blob([text], { type: 'text/plain' })\n                })]);\n                ok = true;\n            } catch (e) { ok = false; }\n        }\n        sel.removeAllRanges();\n        area.classList.remove('copying');\n        done(ok ? '已复制' : '复制失败，请长按选中后复制');\n    }\n\n    function togglePreviewEdit() {\n        const area = document.getElementById('previewArea');\n        const btn = document.getElementById('editBtn');\n        const editing = area.getAttribute('contenteditable') === 'true';\n        area.setAttribute('contenteditable', editing ? 'false' : 'true');\n        area.classList.toggle('editing', !editing);\n        btn.textContent = editing ? '编辑' : '完成';\n        document.querySelector('.editor-container').classList.toggle('is-editing', !editing);\n        if (!editing) { loadRandomTitle(); toggleFloat('titleWin', true); }   // 进入编辑模式：自动弹出标题悬浮窗\n        else { toggleFloat('titleWin', false); toggleFloat('editPanel', false); }\n        area.querySelectorAll('[data-preview-gif], [data-preview-gif] *').forEach(el =\u003e {\n            if (el.getAttribute \u0026\u0026 el.getAttribute('contenteditable') === 'false') el.removeAttribute('contenteditable');\n        });\n        if (!editing) area.focus();\n        updatePreviewCharCount();\n    }\n\n\n    document.addEventListener('input', function(event) {\n        if (event.target \u0026\u0026 event.target.id === 'previewArea') updatePreviewCharCount();\n    });\n    document.addEventListener('DOMContentLoaded', updatePreviewCharCount);\n\n\u003c/script\u003e\n\n\u003c/body\u003e\n\u003c/html\u003e\n\n","my":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"zh-CN\"\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n    \u003ctitle\u003e我的\u003c/title\u003e\n    \u003c!-- Tailwind CSS --\u003e\n    \u003cscript src=\"https://cdn.tailwindcss.com\"\u003e\u003c/script\u003e\n    \u003cscript\u003e\n        /* 主题色：默认 #ccff00（排版页主题色），可通过 localStorage.app_theme_color 统一覆盖，两个页面同步 */\n        (function(){try{var c=localStorage.getItem('app_theme_color');if(c\u0026\u0026/^#[0-9a-f]{6}$/i.test(c)){var s=document.documentElement.style,n=parseInt(c.slice(1),16),l=0.299*(n\u003e\u003e16)+0.587*((n\u003e\u003e8)\u0026255)+0.114*(n\u0026255);s.setProperty('--theme',c);s.setProperty('--theme-on',l\u003e150?'#000000':'#ffffff');}}catch(e){}})();\n    \u003c/script\u003e\n    \u003cstyle\u003e\n        :root { --theme: #ccff00; --theme-on: #000000; }\n        .theme-fill { background-color: var(--theme); color: var(--theme-on); }\n        .theme-fill:hover { filter: brightness(0.93); }\n        /* 导航标签：选中项填充主题色 */\n        .tab-btn { flex: 1; padding: 12px 0; text-align: center; font-weight: 500; font-size: 14px; color: #6b7280; cursor: pointer; border-bottom: 2px solid transparent; transition: background-color .15s; }\n        .tab-btn.active { background-color: var(--theme); color: var(--theme-on); border-bottom-color: var(--theme); }\n\n        /* 外观设置：主题颜色与图标风格选择 */\n        .appearance-section { margin: 0 0 26px; }\n        .appearance-section-title { font-size: 15px; font-weight: 600; color: #202124; margin: 0 0 14px; }\n        .theme-choice-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); column-gap:10px; row-gap:18px; }\n        .theme-choice { min-width:0; display:flex; align-items:center; gap:7px; padding:3px 0; border:0; background:transparent; color:#444; text-align:left; cursor:pointer; }\n        .theme-swatch { width:19px; height:19px; flex:none; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:700; }\n        .theme-choice-name { font-size:12px; white-space:nowrap; }\n        .theme-choice.selected .theme-choice-name { color:var(--theme); font-weight:600; }\n        .icon-choice-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:18px 12px; }\n        .icon-choice { min-width:0; padding:0; border:0; background:transparent; display:flex; flex-direction:column; align-items:center; gap:7px; cursor:pointer; color:#555; }\n        .appearance-icon-art { width:100%; aspect-ratio:1/1; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; border-radius:15px; isolation:isolate; }\n        .appearance-icon-art svg { width:76%; height:76%; position:relative; z-index:2; overflow:visible; }\n        .appearance-icon-art svg path { fill:var(--mark,#fff1d2); }\n        .icon-choice-name { font-size:12px; line-height:1.2; text-align:center; }\n        .icon-choice.selected .icon-choice-name { color:var(--theme); font-weight:600; }\n        .icon-choice.selected .appearance-icon-art { outline:none; }\n        .appearance-icon-selected-check { display:none; position:absolute; z-index:4; top:6px; right:6px; width:19px; height:19px; border-radius:50%; align-items:center; justify-content:center; background:var(--theme); color:var(--theme-on); font-size:12px; font-weight:700; }\n        .icon-choice.selected .appearance-icon-selected-check { display:flex; }\n        .appearance-icon-art.original { background:#f2e8cf; --mark:#c69e50; }\n        .appearance-icon-art.cowboy { background:repeating-linear-gradient(0deg,#28547c 0 3px,#315f89 3px 6px); --mark:#f5e7c5; }\n        .appearance-icon-art.cowboy:before { content:\"\"; position:absolute; inset:7%; border:2px dashed #d6c08e; border-radius:13px; z-index:1; }\n        .appearance-icon-art.cowboy:after { content:\"✦\"; position:absolute; right:12%; top:7%; color:#f5d58a; font-size:17px; z-index:3; }\n        .appearance-icon-art.code { background:linear-gradient(145deg,#101923,#202e3b); --mark:#7dff9a; }\n        .appearance-icon-art.code:before { content:\"\u003c/\u003e\"; position:absolute; top:8%; left:9%; color:#66e58d; font:700 10px monospace; z-index:3; }\n        .appearance-icon-art.code:after { content:\"\"; position:absolute; left:10%; bottom:12%; width:25%; height:2px; background:#66e58d; box-shadow:0 -5px #426f83,0 -10px #426f83; z-index:3; }\n        .appearance-icon-art.line { background:#faf9f4; --mark:transparent; }\n        .appearance-icon-art.line svg path { fill:none; stroke:#343434; stroke-width:17; stroke-linecap:round; stroke-linejoin:round; }\n        .appearance-icon-art.line:after { content:\"\"; position:absolute; inset:12%; border:1px solid #c8c4b8; border-radius:48% 52% 45% 55%; transform:rotate(-5deg); }\n        .appearance-icon-art.plush { background:radial-gradient(circle at 35% 25%,#fff0dc,#f3b8ad); --mark:#fff9ec; }\n        .appearance-icon-art.plush svg { filter:drop-shadow(0 2px 0 #d99b91) drop-shadow(0 4px 4px #b97d76); }\n        .appearance-icon-art.plush:after { content:\"\"; position:absolute; inset:9%; border:4px dotted rgba(255,255,255,.65); border-radius:50%; }\n        .appearance-icon-art.sky { background:linear-gradient(160deg,#5bb9f3,#c8edff); --mark:#fff; }\n        .appearance-icon-art.sky:before { content:\"☁\"; position:absolute; left:6%; top:2%; color:#fff; font-size:25px; z-index:3; }\n        .appearance-icon-art.sky:after { content:\"☀\"; position:absolute; right:8%; bottom:6%; color:#ffe58b; font-size:19px; z-index:3; }\n        .appearance-icon-art.space { background:radial-gradient(circle at 65% 30%,#5d4b9e,#17152f 65%); --mark:#d9d4ff; }\n        .appearance-icon-art.space:before { content:\"✦  ·  ✧\"; position:absolute; inset:8% 0 auto; text-align:center; color:#fff; font-size:15px; letter-spacing:4px; z-index:3; }\n        .appearance-icon-art.space:after { content:\"·  ✦   ·\"; position:absolute; bottom:8%; left:0; width:100%; text-align:center; color:#b9d8ff; font-size:12px; z-index:3; }\n        .appearance-icon-art.graffiti { background:#ffdb4d; --mark:#ff5b59; transform:rotate(-1deg); }\n        .appearance-icon-art.graffiti:before { content:\"✳\"; position:absolute; top:3%; right:9%; color:#276bd4; font-size:22px; z-index:3; }\n        .appearance-icon-art.graffiti:after { content:\"〰\"; position:absolute; bottom:5%; left:7%; color:#e94f8a; font-size:24px; z-index:3; }\n        .appearance-icon-art.kids { background:linear-gradient(135deg,#f9c6c6,#c9e8c9 52%,#c9dcff); --mark:#fff7d8; }\n        .appearance-icon-art.kids:before { content:\"✿\"; position:absolute; left:8%; top:4%; color:#f06b7d; font-size:20px; z-index:3; }\n        .appearance-icon-art.kids:after { content:\"★\"; position:absolute; right:8%; bottom:5%; color:#f2b83f; font-size:17px; z-index:3; }\n        .appearance-icon-art.pixel { background:#18233d; --mark:#f6d66b; image-rendering:pixelated; }\n        .appearance-icon-art.pixel svg { filter:drop-shadow(3px 0 #f06c68) drop-shadow(-3px 0 #60d4cf); shape-rendering:crispEdges; }\n        .appearance-icon-art.pixel:after { content:\"\"; position:absolute; inset:0; opacity:.13; background:repeating-linear-gradient(0deg,transparent 0 7px,#fff 7px 8px),repeating-linear-gradient(90deg,transparent 0 7px,#fff 7px 8px); }\n        .appearance-icon-art.sketch { background:repeating-linear-gradient(0deg,#f4f0e4 0 3px,#f0eadb 3px 4px); --mark:transparent; }\n        .appearance-icon-art.sketch svg path { fill:none; stroke:#5b554c; stroke-width:13; stroke-linecap:round; stroke-linejoin:round; }\n        .appearance-icon-art.sketch:after { content:\"\"; position:absolute; inset:11%; border:1px solid #a69d8d; transform:rotate(-4deg); }\n        @media(max-width:360px){ .theme-choice-grid{column-gap:6px;} .theme-choice{gap:5px;} .theme-swatch{width:16px;height:16px;} .theme-choice-name{font-size:11px;} .icon-choice-grid{gap:15px 9px;} }\n\n        /* 文案排序模式 */\n        .sort-row { touch-action: none; }\n        .sort-handle-cell { touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }\n        .sort-handle { touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; font-size: 20px; line-height: 1; color: #9ca3af; padding: 6px 4px 6px 12px; }\n        .sort-dragging { box-shadow: 0 6px 18px rgba(0,0,0,.18); outline: 2px solid var(--theme); position: relative; z-index: 5; opacity: .95; }\n    \u003c/style\u003e\n    \u003c!-- Lucide 图标 --\u003e\n    \u003cscript src=\"https://unpkg.com/lucide@latest/dist/umd/lucide.js\"\u003e\u003c/script\u003e\n    \u003cscript\u003eif (!window.lucide) { window.lucide = { createIcons: function () {} }; }\u003c/script\u003e\n\u003c/head\u003e\n\u003cbody class=\"bg-[#f7f7f7] text-gray-800 antialiased\"\u003e\n\n    \u003c!-- 1. 主页面：我的 --\u003e\n    \u003cdiv id=\"myView\" class=\"min-h-screen flex flex-col view-section\"\u003e\n        \u003cdiv class=\"bg-[#f7f7f7] px-4 py-3 flex items-center sticky top-0 z-20\"\u003e\n            \u003cbutton id=\"backBtn\" class=\"text-gray-700 focus:outline-none pr-4 cursor-pointer\"\u003e\n                \u003ci data-lucide=\"chevron-left\" class=\"w-6 h-6 stroke-[1.5]\"\u003e\u003c/i\u003e\n            \u003c/button\u003e\n            \u003ch1 class=\"text-lg font-medium text-gray-900 flex-1 text-center pr-6\"\u003e我的\u003c/h1\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"p-3 space-y-3 flex-1 text-base max-w-2xl mx-auto w-full\"\u003e\n\n            \u003c!-- 设置入口：置于账号上方 --\u003e\n            \u003cdiv class=\"bg-white rounded-xl overflow-hidden shadow-sm\"\u003e\n                \u003cdiv id=\"openAppearanceSettings\" class=\"px-4 py-4 flex justify-between items-center hover:bg-gray-50 cursor-pointer transition\"\u003e\n                    \u003cspan class=\"text-gray-800 font-medium\"\u003e设置\u003c/span\u003e\n                    \u003cdiv class=\"flex items-center gap-2 text-gray-400\"\u003e\n                        \u003cspan class=\"text-gray-500 text-sm\"\u003e主题颜色、图标风格\u003c/span\u003e\n                        \u003ci data-lucide=\"chevron-right\" class=\"w-4 h-4 stroke-[1.5] text-gray-400\"\u003e\u003c/i\u003e\n                    \u003c/div\u003e\n                \u003c/div\u003e\n            \u003c/div\u003e\n\n            \u003c!-- 账号 --\u003e\n            \u003cdiv class=\"bg-white rounded-xl overflow-hidden shadow-sm\"\u003e\n                \u003cdiv id=\"openAccount\" class=\"px-4 py-4 flex justify-between items-center hover:bg-gray-50 cursor-pointer transition\"\u003e\n                    \u003cspan class=\"text-gray-800 font-medium\"\u003e账号\u003c/span\u003e\n                    \u003cdiv class=\"flex items-center gap-2 text-gray-400\"\u003e\n                        \u003cspan id=\"displayAccountInfo\" class=\"text-gray-500 text-sm\"\u003e多账号管理、配置信息\u003c/span\u003e\n                        \u003ci data-lucide=\"chevron-right\" class=\"w-4 h-4 stroke-[1.5] text-gray-400\"\u003e\u003c/i\u003e\n                    \u003c/div\u003e\n                \u003c/div\u003e\n            \u003c/div\u003e\n\n            \u003c!-- 文件 --\u003e\n            \u003cdiv class=\"bg-white rounded-xl overflow-hidden shadow-sm\"\u003e\n                \u003cdiv id=\"openFileManage\" class=\"px-4 py-4 flex justify-between items-center hover:bg-gray-50 cursor-pointer transition\"\u003e\n                    \u003cspan class=\"text-gray-800 font-medium\"\u003e文案\u003c/span\u003e\n                    \u003cdiv class=\"flex items-center gap-2 text-gray-400\"\u003e\n                        \u003cspan id=\"displayFileSummary\" class=\"text-gray-500 text-sm\"\u003e文案模块管理、排序\u003c/span\u003e\n                        \u003ci data-lucide=\"chevron-right\" class=\"w-4 h-4 stroke-[1.5] text-gray-400\"\u003e\u003c/i\u003e\n                    \u003c/div\u003e\n                \u003c/div\u003e\n            \u003c/div\u003e\n\n            \u003c!-- 版式 --\u003e\n            \u003cdiv class=\"bg-white rounded-xl overflow-hidden shadow-sm\"\u003e\n                \u003cdiv id=\"openLayoutSettings\" class=\"px-4 py-4 flex justify-between items-center hover:bg-gray-50 cursor-pointer transition\"\u003e\n                    \u003cspan class=\"text-gray-800 font-medium\"\u003e版式\u003c/span\u003e\n                    \u003cdiv class=\"flex items-center gap-2 text-gray-400\"\u003e\n                        \u003cspan id=\"displayLayoutSummary\" class=\"text-gray-500 text-sm\"\u003e布局、排版预览、代码渲染\u003c/span\u003e\n                        \u003ci data-lucide=\"chevron-right\" class=\"w-4 h-4 stroke-[1.5] text-gray-400\"\u003e\u003c/i\u003e\n                    \u003c/div\u003e\n                \u003c/div\u003e\n            \u003c/div\u003e\n\n            \u003c!-- 更多（emoji / 往期 / 动图） --\u003e\n            \u003cdiv class=\"bg-white rounded-xl overflow-hidden shadow-sm\"\u003e\n                \u003cdiv id=\"openMore\" class=\"px-4 py-4 flex justify-between items-center hover:bg-gray-50 cursor-pointer transition\"\u003e\n                    \u003cspan class=\"text-gray-800 font-medium\"\u003e更多\u003c/span\u003e\n                    \u003cdiv class=\"flex items-center gap-2 text-gray-400\"\u003e\n                        \u003cspan id=\"displayMoreSummary\" class=\"text-gray-500 text-sm\"\u003eemoji、往期、动图\u003c/span\u003e\n                        \u003ci data-lucide=\"chevron-right\" class=\"w-4 h-4 stroke-[1.5] text-gray-400\"\u003e\u003c/i\u003e\n                    \u003c/div\u003e\n                \u003c/div\u003e\n            \u003c/div\u003e\n\n            \u003c!-- 备份 --\u003e\n            \u003cdiv class=\"bg-white rounded-xl overflow-hidden shadow-sm\"\u003e\n                \u003cdiv id=\"openBackupView\" class=\"px-4 py-4 flex justify-between items-center hover:bg-gray-50 cursor-pointer transition\"\u003e\n                    \u003cspan class=\"text-gray-800 font-medium\"\u003e备份\u003c/span\u003e\n                    \u003cdiv class=\"flex items-center gap-2 text-gray-400\"\u003e\n                        \u003cspan class=\"text-gray-500 text-sm\"\u003e完整数据导出与恢复导入\u003c/span\u003e\n                        \u003ci data-lucide=\"chevron-right\" class=\"w-4 h-4 stroke-[1.5] text-gray-400\"\u003e\u003c/i\u003e\n                    \u003c/div\u003e\n                \u003c/div\u003e\n            \u003c/div\u003e\n        \u003c/div\u003e\n    \u003c/div\u003e\n\n\n    \u003c!-- 2. 子页面容器 --\u003e\n    \n\n    \u003c!-- 外观设置子页面 --\u003e\n    \u003cdiv id=\"settingsView\" class=\"min-h-screen bg-[#f7f7f7] flex flex-col hidden view-section\"\u003e\n        \u003cdiv class=\"bg-[#f7f7f7] px-4 py-3 flex items-center sticky top-0 z-20 border-b border-gray-200/50\"\u003e\n            \u003cbutton onclick=\"switchView('myView')\" class=\"text-gray-700 pr-3 cursor-pointer flex items-center\"\u003e\u003ci data-lucide=\"chevron-left\" class=\"w-6 h-6\"\u003e\u003c/i\u003e\u003cspan class=\"text-base\"\u003e我的\u003c/span\u003e\u003c/button\u003e\n            \u003ch1 class=\"text-lg font-medium text-gray-900 flex-1 text-center pr-12\"\u003e设置\u003c/h1\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"px-4 pt-5 pb-10 max-w-2xl mx-auto w-full flex-1\"\u003e\n            \u003csection class=\"appearance-section\"\u003e\n                \u003ch2 class=\"appearance-section-title\"\u003e主题颜色\u003c/h2\u003e\n                \u003cdiv id=\"themeChoiceGrid\" class=\"theme-choice-grid\"\u003e\u003c/div\u003e\n            \u003c/section\u003e\n            \u003csection class=\"appearance-section\"\u003e\n                \u003ch2 class=\"appearance-section-title\"\u003e图标风格\u003c/h2\u003e\n                \u003cdiv id=\"iconChoiceGrid\" class=\"icon-choice-grid\"\u003e\u003c/div\u003e\n            \u003c/section\u003e\n        \u003c/div\u003e\n    \u003c/div\u003e\n\n    \u003c!-- ① 账号管理子页面 --\u003e\n    \u003cdiv id=\"accountView\" class=\"min-h-screen bg-[#f7f7f7] flex flex-col hidden view-section\"\u003e\n        \u003cdiv class=\"bg-[#f7f7f7] px-4 py-3 flex items-center sticky top-0 z-20 border-b border-gray-200/50\"\u003e\n            \u003cbutton onclick=\"switchView('myView')\" class=\"text-gray-700 pr-3 cursor-pointer flex items-center\"\u003e\u003ci data-lucide=\"chevron-left\" class=\"w-6 h-6\"\u003e\u003c/i\u003e\u003cspan class=\"text-base\"\u003e我的\u003c/span\u003e\u003c/button\u003e\n            \u003ch1 class=\"text-lg font-medium text-gray-900 flex-1 text-center pr-12\"\u003e账号管理\u003c/h1\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"p-4 max-w-2xl mx-auto w-full space-y-3 flex-1\"\u003e\n            \u003cdiv class=\"flex justify-between items-center mb-1\"\u003e\n                \u003cspan class=\"text-sm text-gray-500 font-medium\"\u003e已有账号列表\u003c/span\u003e\n                \u003cbutton onclick=\"openAccountEditModal()\" class=\"text-sm theme-fill px-3 py-1.5 rounded-lg cursor-pointer flex items-center gap-1\"\u003e\u003ci data-lucide=\"plus\" class=\"w-4 h-4\"\u003e\u003c/i\u003e 新增账号\u003c/button\u003e\n            \u003c/div\u003e\n            \u003cdiv id=\"accountListContainer\" class=\"space-y-3\"\u003e\u003c/div\u003e\n        \u003c/div\u003e\n    \u003c/div\u003e\n\n    \u003c!-- ② 文案子页面 --\u003e\n    \u003cdiv id=\"fileView\" class=\"min-h-screen bg-[#f7f7f7] flex flex-col hidden view-section\"\u003e\n        \u003cdiv class=\"bg-[#f7f7f7] px-4 py-3 flex items-center sticky top-0 z-20 border-b border-gray-200/50\"\u003e\n            \u003cbutton onclick=\"switchView('myView')\" class=\"text-gray-700 pr-3 cursor-pointer flex items-center\"\u003e\u003ci data-lucide=\"chevron-left\" class=\"w-6 h-6\"\u003e\u003c/i\u003e\u003cspan class=\"text-base\"\u003e我的\u003c/span\u003e\u003c/button\u003e\n            \u003ch1 class=\"text-lg font-medium text-gray-900 flex-1 text-center pr-12\"\u003e文案\u003c/h1\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"p-4 max-w-2xl mx-auto w-full flex-1\"\u003e\n            \u003cdiv class=\"flex justify-between items-center mb-3\"\u003e\n                \u003cspan id=\"fileCurrentCategoryTitle\" class=\"text-sm text-gray-500 font-medium\"\u003e文案模块列表\u003c/span\u003e\n                \u003cdiv class=\"flex items-center gap-2\"\u003e\n                    \u003cbutton id=\"viewToggleBtn\" onclick=\"toggleViewMode()\" class=\"text-sm bg-white border border-gray-200 text-gray-700 px-3 py-1.5 rounded-lg cursor-pointer\"\u003e宫格\u003c/button\u003e\n                    \u003cbutton id=\"sortToggleBtn\" onclick=\"toggleSortMode()\" class=\"text-sm bg-white border border-gray-200 text-gray-700 px-3 py-1.5 rounded-lg cursor-pointer\"\u003e排序\u003c/button\u003e\n                    \u003cbutton id=\"fileAddBtn\" onclick=\"openFileEditModal()\" class=\"text-sm theme-fill px-3 py-1.5 rounded-lg cursor-pointer flex items-center gap-1\"\u003e\u003ci data-lucide=\"plus\" class=\"w-4 h-4\"\u003e\u003c/i\u003e 新建模块\u003c/button\u003e\n                \u003c/div\u003e\n            \u003c/div\u003e\n            \u003cp id=\"sortHint\" class=\"hidden text-xs text-gray-400 mb-2\"\u003e按住右侧 ≡ 上下拖动调整顺序，调整后自动保存\u003c/p\u003e\n            \u003cdiv id=\"fileListContainer\" class=\"space-y-3\"\u003e\u003c/div\u003e\n        \u003c/div\u003e\n    \u003c/div\u003e\n\n    \u003c!-- ③ 版式管理子页面 --\u003e\n    \u003cdiv id=\"layoutView\" class=\"min-h-screen bg-[#f7f7f7] flex flex-col hidden view-section\"\u003e\n        \u003cdiv class=\"bg-[#f7f7f7] px-4 py-3 flex items-center sticky top-0 z-20 border-b border-gray-200/50\"\u003e\n            \u003cbutton onclick=\"switchView('myView')\" class=\"text-gray-700 pr-3 cursor-pointer flex items-center\"\u003e\u003ci data-lucide=\"chevron-left\" class=\"w-6 h-6\"\u003e\u003c/i\u003e\u003cspan class=\"text-base\"\u003e我的\u003c/span\u003e\u003c/button\u003e\n            \u003ch1 class=\"text-lg font-medium text-gray-900 flex-1 text-center pr-12\"\u003e版式管理\u003c/h1\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"p-4 max-w-2xl mx-auto w-full space-y-3 flex-1\"\u003e\n            \u003cdiv class=\"flex justify-between items-center mb-1\"\u003e\n                \u003cspan class=\"text-sm text-gray-500 font-medium\"\u003e已有版式列表\u003c/span\u003e\n                \u003cbutton onclick=\"openGenericEditModal('layout')\" class=\"text-sm theme-fill px-3 py-1.5 rounded-lg cursor-pointer flex items-center gap-1\"\u003e\u003ci data-lucide=\"plus\" class=\"w-4 h-4\"\u003e\u003c/i\u003e 新增版式\u003c/button\u003e\n            \u003c/div\u003e\n            \u003cdiv id=\"layoutListContainer\" class=\"space-y-3\"\u003e\u003c/div\u003e\n        \u003c/div\u003e\n    \u003c/div\u003e\n\n    \u003c!-- ④ 更多子页面（emoji / 往期 / 动图） --\u003e\n    \u003cdiv id=\"moreView\" class=\"min-h-screen bg-[#f7f7f7] flex flex-col hidden view-section\"\u003e\n        \u003cdiv class=\"bg-[#f7f7f7] px-4 py-3 flex items-center sticky top-0 z-20 border-b border-gray-200/50\"\u003e\n            \u003cbutton onclick=\"switchView('myView')\" class=\"text-gray-700 pr-3 cursor-pointer flex items-center\"\u003e\u003ci data-lucide=\"chevron-left\" class=\"w-6 h-6\"\u003e\u003c/i\u003e\u003cspan class=\"text-base\"\u003e我的\u003c/span\u003e\u003c/button\u003e\n            \u003ch1 class=\"text-lg font-medium text-gray-900 flex-1 text-center pr-12\"\u003e更多\u003c/h1\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"bg-white flex border-b border-gray-200\"\u003e\n            \u003cbutton onclick=\"switchMoreTab('emoji')\" id=\"moreTabBtnEmoji\" class=\"tab-btn active\"\u003eemoji\u003c/button\u003e\n            \u003cbutton onclick=\"switchMoreTab('history')\" id=\"moreTabBtnHistory\" class=\"tab-btn\"\u003e往期\u003c/button\u003e\n            \u003cbutton onclick=\"switchMoreTab('gif')\" id=\"moreTabBtnGif\" class=\"tab-btn\"\u003e动图\u003c/button\u003e\n            \u003cbutton onclick=\"switchMoreTab('image')\" id=\"moreTabBtnImage\" class=\"tab-btn\"\u003e配图\u003c/button\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"p-4 max-w-2xl mx-auto w-full flex-1\"\u003e\n            \u003cdiv class=\"flex justify-between items-center mb-3\"\u003e\n                \u003cspan id=\"moreCurrentTitle\" class=\"text-sm text-gray-500 font-medium\"\u003e已有 Emoji 列表\u003c/span\u003e\n                \u003cbutton onclick=\"openMoreAdd()\" class=\"text-sm theme-fill px-3 py-1.5 rounded-lg cursor-pointer flex items-center gap-1\"\u003e\u003ci data-lucide=\"plus\" class=\"w-4 h-4\"\u003e\u003c/i\u003e \u003cspan id=\"moreAddLabel\"\u003e新增 Emoji\u003c/span\u003e\u003c/button\u003e\n            \u003c/div\u003e\n            \u003cdiv id=\"moreListContainer\" class=\"space-y-3\"\u003e\u003c/div\u003e\n        \u003c/div\u003e\n    \u003c/div\u003e\n\n    \u003c!-- ⑥ 备份管理子页面 --\u003e\n    \u003cdiv id=\"backupView\" class=\"min-h-screen bg-[#f7f7f7] flex flex-col hidden view-section\"\u003e\n        \u003cdiv class=\"bg-[#f7f7f7] px-4 py-3 flex items-center sticky top-0 z-20 border-b border-gray-200/50\"\u003e\n            \u003cbutton onclick=\"switchView('myView')\" class=\"text-gray-700 pr-3 cursor-pointer flex items-center\"\u003e\u003ci data-lucide=\"chevron-left\" class=\"w-6 h-6\"\u003e\u003c/i\u003e\u003cspan class=\"text-base\"\u003e我的\u003c/span\u003e\u003c/button\u003e\n            \u003ch1 class=\"text-lg font-medium text-gray-900 flex-1 text-center pr-12\"\u003e备份与恢复\u003c/h1\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"p-4 max-w-2xl mx-auto w-full space-y-4 flex-1\"\u003e\n            \u003cdiv class=\"bg-white p-5 rounded-xl shadow-sm space-y-4\"\u003e\n                \u003cdiv\u003e\n                    \u003ch3 class=\"font-medium text-gray-900 mb-1\"\u003e导出完整备份\u003c/h3\u003e\n                    \u003cp class=\"text-xs text-gray-500 mb-3\"\u003e完整导出“我的”界面内所有项目（账号、文案、版式、更多）的全部设置项为一个 JSON 文件。\u003c/p\u003e\n                    \u003cbutton onclick=\"exportAllData()\" class=\"w-full theme-fill py-2.5 rounded-lg text-sm font-medium cursor-pointer transition\"\u003e一键导出数据备份\u003c/button\u003e\n                \u003c/div\u003e\n                \u003chr class=\"border-gray-100\"\u003e\n                \u003cdiv\u003e\n                    \u003ch3 class=\"font-medium text-gray-900 mb-1\"\u003e恢复导入备份\u003c/h3\u003e\n                    \u003cp class=\"text-xs text-gray-500 mb-3\"\u003e选择先前导出的备份 JSON 文件，可自动将全部设置内容精准写入界面对应配置位置。\u003c/p\u003e\n                    \u003cinput type=\"file\" id=\"importFileField\" accept=\".json\" class=\"hidden\" onchange=\"importAllData(event)\"\u003e\n                    \u003cbutton onclick=\"document.getElementById('importFileField').click()\" class=\"w-full bg-gray-100 text-gray-700 py-2.5 rounded-lg text-sm font-medium cursor-pointer hover:bg-gray-200 transition border border-gray-200\"\u003e选择备份文件并恢复\u003c/button\u003e\n                \u003c/div\u003e\n            \u003c/div\u003e\n        \u003c/div\u003e\n    \u003c/div\u003e\n\n\n    \u003c!-- 3. 公共渲染预览/详情/编辑页面 (针对 版式/往期/Emoji) --\u003e\n    \u003cdiv id=\"genericDetailView\" class=\"min-h-screen bg-[#f7f7f7] flex flex-col hidden view-section\"\u003e\n        \u003cdiv class=\"bg-[#f7f7f7] px-4 py-3 flex items-center sticky top-0 z-20 border-b border-gray-200/50\"\u003e\n            \u003cbutton id=\"genericBackBtn\" class=\"text-gray-700 pr-3 cursor-pointer flex items-center\"\u003e\u003ci data-lucide=\"chevron-left\" class=\"w-6 h-6\"\u003e\u003c/i\u003e\u003cspan id=\"genericBackLabel\" class=\"text-base\"\u003e返回\u003c/span\u003e\u003c/button\u003e\n            \u003ch1 id=\"genericDetailTitle\" class=\"text-lg font-medium text-gray-900 flex-1 text-center pr-12\"\u003e详情与编辑\u003c/h1\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"p-4 max-w-2xl mx-auto w-full space-y-4 flex-1\"\u003e\n            \u003cdiv class=\"bg-white p-4 rounded-xl shadow-sm space-y-3\"\u003e\n                \u003cdiv\u003e\n                    \u003clabel class=\"block text-xs font-medium text-gray-500 mb-1\" id=\"genericNameLabel\"\u003e配置名称\u003c/label\u003e\n                    \u003cinput type=\"text\" id=\"genericNameInput\" class=\"w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500\" placeholder=\"请输入名称\"\u003e\n                \u003c/div\u003e\n                \u003cdiv id=\"historyFieldsBox\" class=\"hidden space-y-3\"\u003e\n                    \u003cdiv\u003e\n                        \u003clabel class=\"block text-xs font-medium text-gray-500 mb-1\"\u003e标题（多行，每行一个）\u003c/label\u003e\n                        \u003ctextarea id=\"genericTitlesInput\" rows=\"4\" class=\"w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500 font-mono\" style=\"white-space:pre;overflow-x:auto;\" placeholder=\"每行一个标题\"\u003e\u003c/textarea\u003e\n                    \u003c/div\u003e\n                    \u003cdiv\u003e\n                        \u003clabel class=\"block text-xs font-medium text-gray-500 mb-1\"\u003e链接（多行，与标题按行一一对应）\u003c/label\u003e\n                        \u003ctextarea id=\"genericLinkInput\" rows=\"4\" class=\"w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500 font-mono\" style=\"white-space:pre;overflow-x:auto;\" placeholder=\"每行一个文章链接\"\u003e\u003c/textarea\u003e\n                    \u003c/div\u003e\n                    \u003cdiv\u003e\n                        \u003clabel class=\"block text-xs font-medium text-gray-500 mb-1\"\u003e图片（多行，与标题按行对应；留空则按文字版渲染）\u003c/label\u003e\n                        \u003ctextarea id=\"genericImageInput\" rows=\"4\" class=\"w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500 font-mono\" style=\"white-space:pre;overflow-x:auto;\" placeholder=\"每行一个图片链接\"\u003e\u003c/textarea\u003e\n                    \u003c/div\u003e\n                \u003c/div\u003e\n                \u003cdiv id=\"genericContentBox\"\u003e\n                    \u003clabel class=\"block text-xs font-medium text-gray-500 mb-1\" id=\"genericContentLabel\"\u003e模板代码 / 内容区域\u003c/label\u003e\n                    \u003ctextarea id=\"genericContentInput\" rows=\"6\" class=\"w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500 font-mono\" placeholder=\"在此输入内容...\"\u003e\u003c/textarea\u003e\n                \u003c/div\u003e\n                \u003c!-- 操作按钮组（包含删除按钮） --\u003e\n                \u003cdiv class=\"flex justify-end gap-2 pt-2 border-t border-gray-100\"\u003e\n                    \u003cbutton onclick=\"deleteCurrentGenericItem()\" class=\"px-4 py-2 text-sm text-red-600 bg-red-50 hover:bg-red-100 rounded-lg cursor-pointer transition\"\u003e删除此项\u003c/button\u003e\n                    \u003cbutton onclick=\"saveGenericItem()\" class=\"px-5 py-2 text-sm theme-fill rounded-lg cursor-pointer transition\"\u003e保存\u003c/button\u003e\n                \u003c/div\u003e\n            \u003c/div\u003e\n\n            \u003c!-- 排版预览区域 --\u003e\n            \u003cdiv class=\"bg-white p-4 rounded-xl shadow-sm space-y-2\"\u003e\n                \u003cdiv class=\"flex justify-between items-center\"\u003e\n                    \u003cspan class=\"text-xs font-medium text-gray-500\"\u003e排版预览与渲染输出\u003c/span\u003e\n                    \u003cbutton onclick=\"copyPreviewContent()\" class=\"text-xs text-blue-600 hover:underline cursor-pointer flex items-center gap-1\"\u003e\n                        \u003ci data-lucide=\"copy\" class=\"w-3.5 h-3.5\"\u003e\u003c/i\u003e 复制预览内容\n                    \u003c/button\u003e\n                \u003c/div\u003e\n                \u003cdiv id=\"renderPreviewBox\" class=\"p-3 bg-gray-50 border border-dashed border-gray-200 rounded-lg max-h-[220px] overflow-y-auto text-sm\"\u003e\n                    \u003c!-- 动态渲染内容 --\u003e\n                \u003c/div\u003e\n            \u003c/div\u003e\n        \u003c/div\u003e\n    \u003c/div\u003e\n\n\n    \u003c!-- 4. 弹窗：账号编辑/新增 --\u003e\n    \u003cdiv id=\"accountModal\" class=\"fixed inset-0 bg-black/40 hidden z-50 flex items-center justify-center p-4\"\u003e\n        \u003cdiv class=\"bg-white rounded-2xl max-w-md w-full p-5 space-y-4 shadow-xl\"\u003e\n            \u003ch3 class=\"text- 2zdehhkrei0l4kpeekd.jpg\\n\\nhttps://res.cloudinary.com/divete82s/image/upload/v1755070301/nzoalt9t8yoens2ijvmf.jpg\\n\\nhttps://res.cloudinary.com/divete82s/image/upload/v1755070300/eer9yugxqnvrduuvuoqe.jpg\\n\\nhttps://res.cloudinary.com/divete82s/image/upload/v1755070298/axqautfeiudxpd2yi5vg.jpg\\n\\nhttps://res.cloudinary.com/divete82s/image/upload/v1755070296/t0k5sor1fwhvuq8dfu3p.jpg\\n\\nhttps://res.cloudinary.com/divete82s/image/upload/v1755070295/za8a4laso1fsz0mvhmux.jpg\\n\\nhttps://res.cloudinary.com/divete82s/image/upload/v1755070295/cxeln8jxg6lhsxmejlak.jpg\\n\\nhttps://res.cloudinary.com/divete82s/image/upload/v1755070294/efolidurtrnqsledcnv4.jpg\\n\\nhttps://res.cloudinary.com/divete82s/image/upload/v1755070291/t6blbqokv5axypbh2eyc.jpg\\n\\nhttps://res.cloudinary.com/divete82s/image/upload/v1755070290/dc85udxeimsew9eabbbv.jpg\\n\\nhttps://res.cloudinary.com/divete82s/image/upload/v1755070289/vubb00df4wx5lsymja4z.jpg\\n\\nhttps://res.cloudinary.com/divete82s/image/upload/v1755070288/injov6andugxcck1crel.jpg\\n\\nhttps://res.cloudinary.com/divete82s/image/upload/v1755070287/ii11pdkjcsf7x0ff2dw1.jpg\\n\\nhttps://res.cloudinary.com/divete82s/image/upload/v1755070286/owkyi2iwjqxu9ayvpofn.jpg\\n\\nhttps://res.cloudinary.com/divete82s/image/upload/v1755070284/dfvcozxvin795ignbnx7.jpg\\n\\nhttps://res.cloudinary.com/divete82s/image/upload/v1755070284/gfyr1ooxewao9ve2josy.jpg\\n\\nhttps://res.cloudinary.com/divete82s/image/upload/v1755070282/s6ikimzyylv8huu80tit.jpg\\n\\nhttps://res.cloudinary.com/divete82s/image/upload/v1755070281/slneqmphwmzz6lk5sppz.jpg\\n\\nhttps://res.cloudinary.com/divete82s/image/upload/v1755070280/v7br5dccmoni4zax6429.jpg\\n\\nhttps://res.cloudinary.com/divete82s/image/upload/v1755070279/cl8w2b7zwcoekruknhp3.jpg\\n\\nhttps://res.cloudinary.com/divete82s/image/upload/v1755070278/bvxvigesf4rh2wrhfrjc.jpg\\n\\nhttps://res.cloudinary.com/divete82s/image/upload/v1755070277/fmulgvxudkd1oyiomaf3.jpg\\n\\nhttps://res.cloudinary.com/divete82s/image/upload/v1755070275/trfvximvpufhwykazrye.jpg\\n\\nhttps://res.cloudinary.com/divete82s/image/upload/v1755070275/ru204unwcuibdls6vh6e.jpg\\n\\nhttps://res.cloudinary.com/divete82s/image/upload/v1755070274/eznafmd7pkckfr8c1k5x.jpg\\n\\nhttps://res.cloudinary.com/divete82s/image/upload/v1755070272/kkdjc02hg8o8e8gr1nql.jpg\\n\\nhttps://res.cloudinary.com/divete82s/image/upload/v1755070272/wrrdkg7xadbyl2jdjf0p.jpg\\n\\nhttps://res.cloudinary.com/divete82s/image/upload/v1755070271/b85pjqiqejfef0bmik1o.jpg\\n\\nhttps://res.cloudinary.com/divete82s/image/upload/v1755070271/yeckmsf2prbymco9bkoi.jpg\\n\\nhttps://res.cloudinary.com/divete82s/image/upload/v1755070271/irhuosrzwzcgw6kzwk5t.jpg\\n\\nhttps://res.cloudinary.com/divete82s/image/upload/v1755070270/tktn7nxzhhrpotnpkh9t.jpg\"}], \"text\": [{\"name\": \"短句\", \"title\": \"普普通通，却喜欢了很久的句子\\n普普通通，却喜欢很久的句子\", \"content\": \"把玫瑰藏于盛夏，把海棠藏于深秋。\\n外面的世界太杂乱，听自己的心就好。\\n因为有很好的人，所以生活很有意思。\\n走下去，前面有路，夜里有灯。\\n也许好运正在排队，等着见我，它也很焦急。\\n大方结束任何不真诚的关系，没什么不对。\\n人生之福，藏于微常。\\n人会因嘴硬失去很多东西，也会因为心软而受很多委屈。\\n的确，人在知足的时候最富有，在珍惜的时候最幸福。\\n有些话我听了会很开心，但我不会信。\\n不用刻意合群，有趣的人自然会相互吸引。\\n希望你的底色一直是善良、真诚、勇敢。\\n晚风吹人醒，万事藏于心，何以言，何能言，与谁言。\\n结局总是好的，如果不好，说明还不是结局。\\n万物更新，旧疾当愈；生来做春风，流浪又自由。\\n年轻时候，喜欢什么，都正常；成熟之后，放弃什么，都能理解。\\n是花自然香是爱自然长，没必要为没必要的人，浪费没必要的时间做没必要的事。\\n岁月浅浅，余生漫漫，予一半烟火，谋生活，许一半诗意得清欢。\\n生活最美的状态就是，人静，物简，心安。\\n不同年纪，不同取舍，人生百味，随意就好，以如常为喜，以如愿为安。\\n生命几许，遵从自己，会好，迟早。\\n以欢喜之心，渡烟火日常，念别人的好，修自己的心。\\n前路浩浩荡荡，万物皆可期待。\\n慢慢理解世界，慢慢更新自己。\\n山海自有归期，风雨自有相逢，意难平终将和解，万事终将如意。\\n记得给自己的开心充值，别让它停机了。\\n慢品人间烟火色，闲观岁月万事长。\\n二两桃花酿作酒，万杯不及你温柔。\\n不自卑也不炫耀，不动声色的变好。\\n生活不是什么都新鲜，安稳比什么都难得。\\n人的内心，不种满鲜花，就会长满杂草。\\n焦虑不会改变任何事，只能搅乱你的脑袋，偷走你的快乐！\\n今天的不开心到此为止，明天依然万丈光芒。\\n时间会筛选身边的人，值得的人一直值得。\\n桂花酒，少年游，大风吹散小忧愁。\\n我偷了落日的酒，与自己化敌为友。\\n日出是免费的，春夏秋冬也是。\\n外界的声音都是参考，你不开心就不要参考。\\n以欢喜之心，渡烟火日常，念他人的好，修自己的心。\\n酷的像风，野的像狗，不讨人喜，倒也自由。\\n希望是火，失望是烟，生活就是一边点火，一边冒烟。\\n爱是繁春里与万蝶对视的瞬息。\\n好事总会发生在下一个转弯。\\n因为有很好的人所以生活很有意思。\\n等日落西山等冬去春来等尘埃落定。\\n当善良遇见了温柔便是人间绝配。\\n我喜欢的少年打天上来他无意掀翻烛火点燃我双眸盛满的暮色。\\n所有的晦暗都留给过往从遇见你开始凛冬散尽星河长明。\"}], \"gif\": [{\"name\"
