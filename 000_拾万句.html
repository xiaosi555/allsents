   n = String(n || '');\n        if (/卡片/.test(n)) return 'card';\n        if (/断章|序引/.test(n)) return 'duan';\n        if (/朋友圈/.test(n)) return 'moments';\n        if (/断句/.test(n)) return 'sentence';\n        if (/抖音/.test(n)) return 'douyin';\n        return '';\n    }\n\n    // 规范化：补全缺失结构；缺 id 的条目按顺序补确定性 id（两页结果一致）；文案缺类别默认【朋友圈】\n    function normalizeData(raw) {\n        const d = JSON.parse(JSON.stringify(raw || {}));\n        const arr = v =\u003e Array.isArray(v) ? v.filter(x =\u003e x \u0026\u0026 typeof x === 'object') : [];\n        d.accounts = arr(d.accounts);\n        d.layout = arr(d.layout);\n        d.history = arr(d.history);\n        d.emoji = arr(d.emoji);\n        d.files = (d.files \u0026\u0026 typeof d.files === 'object') ? d.files : {};\n        ['image', 'text', 'gif'].forEach(k =\u003e { d.files[k] = arr(d.files[k]); });\n\n        const fillIds = (list, prefix) =\u003e {\n            const used = new Set();\n            const missing = [];\n            list.forEach((it, i) =\u003e {\n                const has = it.id !== undefined \u0026\u0026 it.id !== null \u0026\u0026 String(it.id) !== '';\n                if (has \u0026\u0026 !used.has(String(it.id))) used.add(String(it.id)); else missing.push(i);\n            });\n            let n = 1;\n            missing.forEach(i =\u003e {\n                let id;\n                do { id = prefix + '_' + (n++); } while (used.has(id));\n                list[i].id = id;\n                used.add(id);\n            });\n        };\n        fillIds(d.accounts, 'acc');\n        fillIds(d.layout, 'layout');\n        fillIds(d.history, 'history');\n        fillIds(d.emoji, 'emoji');\n        ['image', 'text', 'gif'].forEach(k =\u003e fillIds(d.files[k], 'file_' + k));\n\n        d.accounts.forEach(a =\u003e { ['avatar', 'name', 'appId', 'secret', 'mpAvatar', 'author'].forEach(f =\u003e { if (a[f] === undefined || a[f] === null) a[f] = ''; }); });\n        ['image', 'text', 'gif'].forEach(k =\u003e d.files[k].forEach(f =\u003e {\n            ['name', 'title', 'content'].forEach(x =\u003e { if (f[x] === undefined || f[x] === null) f[x] = ''; });\n        }));\n        d.files.text.forEach(f =\u003e { if (!TEXT_CATEGORIES.includes(f.category)) f.category = '朋友圈'; });\n        if (d.layoutVer !== LAYOUT_VER) {\n            d.layout.forEach(l =\u003e { const k = layoutKindOf(l.name); if (k \u0026\u0026 LAYOUT_TPL[k]) l.content = LAYOUT_TPL[k]; });\n            d.layoutVer = LAYOUT_VER;\n        }\n        // 新增抖音版：只补一次（之后用户删除不会再自动补回）\n        if (!d.douyinAdded) {\n            if (!d.layout.some(l =\u003e /抖音/.test(l.name || ''))) {\n                const item = { id: 'layout_douyin', name: '04_抖音版', content: DOUYIN_TPL };\n                const at = d.layout.findIndex(l =\u003e /^\\s*05/.test(l.name || ''));\n                if (at \u003e= 0) d.layout.splice(at, 0, item); else d.layout.push(item);\n            }\n            d.douyinAdded = true;\n        }\n        return d;\n    }\n\n    const LAYOUT_PAGE_URL = '拾万句APP_02_排版页.html'; // 如改了文件名，请同步修改此处\n\n    // 首次载入：写入备份数据（仅一次，之后以本地数据为准）；其余情况读取本地数据\n    function initAppData() {\n        let raw = null;\n        try {\n            if (localStorage.getItem(SEED_FLAG_KEY) === SEED_ID) {\n                const s = localStorage.getItem(STORAGE_KEY);\n                if (s) raw = JSON.parse(s);\n            }\n        } catch (e) { raw = null; }\n        const data = normalizeData(raw || SEED_DATA);\n        try {\n            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));\n            localStorage.setItem(SEED_FLAG_KEY, SEED_ID);\n        } catch (e) {}\n        return data;\n    }\n    let appData = initAppData();\n\n        function saveData() {\n            localStorage.setItem('my_admin_data', JSON.stringify(appData));\n        }\n\n\n        const APPEARANCE_THEMES = [\n            {name:'珊瑚红',color:'#FF6B6B'},{name:'海洋蓝',color:'#2688D9'},{name:'电光紫',color:'#8B5CF6'},\n            {name:'活力橙',color:'#FF8A24'},{name:'翡翠绿',color:'#16A66A'},{name:'湖水青',color:'#16B8B0'},\n            {name:'玫瑰粉',color:'#F06292'},{name:'柠檬黄',color:'#F4D21F'},{name:'靛蓝',color:'#4656C9'}\n        ];\n        const APPEARANCE_ICONS = [\n            ['original','原版'],['cowboy','牛仔'],['code','代码'],['line','简笔画'],['plush','毛绒'],\n            ['sky','天空'],['space','深空'],['graffiti','涂鸦'],['kids','童趣'],['pixel','8-Bit'],['sketch','手稿']\n        ];\n        const LOGO_PATHS = [\n            'M611.79 367.2C564 318.61 500.35 291.85 432.64 291.85S301.29 318.61 253.48 367.2c-47.63 48.39-73.85 112.69-73.85 181s26.22 132.64 73.85 181c47.81 48.59 111.44 75.35 179.16 75.35S564 777.86 611.79 729.27c47.63-48.4 73.85-112.69 73.85-181s-26.22-132.61-73.85-181ZM432.64 714.62c-89.89 0-163-74.64-163-166.39s73.12-166.38 163-166.38 163 74.64 163 166.38-73.12 166.39-163 166.39Z',\n            'M619.89 217a45 45 0 0 1-45 45H290.39a45 45 0 0 1 0-90h284.5a45 45 0 0 1 45 45Z',\n            'M824.81 439.79c-1.55.15-3.08.23-4.6.23a45 45 0 0 1-44.72-40.46C757.57 223.09 610.07 90 432.4 90c-175.65 0-323 131.39-342.68 305.63A45 45 0 0 1 .29 385.51a434.92 434.92 0 0 1 864.74 5 45 45 0 0 1-40.22 49.28Z'\n        ];\n        function appearanceLogoSvg() {\n            return '\u003csvg viewBox=\"0 0 865.26 804.62\" aria-hidden=\"true\"\u003e' + LOGO_PATHS.map(d =\u003e '\u003cpath d=\"' + d + '\"\u003e\u003c/path\u003e').join('') + '\u003c/svg\u003e';\n        }\n        function currentAppearanceTheme() {\n            try { return localStorage.getItem('app_theme_color') || ''; } catch(e) { return ''; }\n        }\n        function currentAppearanceIcon() {\n            try { return localStorage.getItem('app_icon_style') || 'original'; } catch(e) { return 'original'; }\n        }\n        function applyAppearanceTheme(color) {\n            if (!/^#[0-9a-f]{6}$/i.test(color)) return;\n            try { localStorage.setItem('app_theme_color', color); } catch(e) {}\n            const n=parseInt(color.slice(1),16), luminance=.299*(n\u003e\u003e16)+.587*((n\u003e\u003e8)\u0026255)+.114*(n\u0026255);\n            const on=luminance\u003e150?'#000000':'#ffffff';\n            document.documentElement.style.setProperty('--theme',color);\n            document.documentElement.style.setProperty('--theme-on',on);\n            try {\n                if (window.parent \u0026\u0026 window.parent !== window) {\n                    window.parent.document.querySelectorAll('iframe').forEach(frame =\u003e {\n                        try { frame.contentDocument.documentElement.style.setProperty('--theme',color); frame.contentDocument.documentElement.style.setProperty('--theme-on',on); } catch(e) {}\n                    });\n                }\n            } catch(e) {}\n            renderAppearanceSettings();\n            window.dispatchEvent(new CustomEvent('app-theme-color-change',{detail:{color:color}}));\n        }\n        function applyAppearanceIcon(style) {\n            if (!APPEARANCE_ICONS.some(item =\u003e item[0] === style)) return;\n            try { localStorage.setItem('app_icon_style',style); } catch(e) {}\n            document.documentElement.dataset.iconStyle=style;\n            renderAppearanceSettings();\n            // Native host can listen for this event and switch the matching Android activity-alias.\n            try { window.parent.postMessage({type:'app-icon-style-change',style:style},'*'); } catch(e) {}\n            window.dispatchEvent(new CustomEvent('app-icon-style-change',{detail:{style:style}}));\n        }\n        function renderAppearanceSettings() {\n            const themes=document.getElementById('themeChoiceGrid'), icons=document.getElementById('iconChoiceGrid');\n            if (!themes || !icons) return;\n            const activeTheme=currentAppearanceTheme(), activeIcon=currentAppearanceIcon();\n            themes.innerHTML=APPEARANCE_THEMES.map(item =\u003e {\n                const selected=activeTheme.toLowerCase()===item.color.toLowerCase();\n                return '\u003cbutton type=\"button\" class=\"theme-choice '+(selected?'selected':'')+'\" aria-pressed=\"'+selected+'\" onclick=\"applyAppearanceTheme(\\''+item.color+'\\')\"\u003e\u003cspan class=\"theme-swatch\" style=\"background:'+item.color+'\"\u003e'+(selected?'✓':'')+'\u003c/span\u003e\u003cspan class=\"theme-choice-name\"\u003e'+item.name+'\u003c/span\u003e\u003c/button\u003e';\n            }).join('');\n            icons.innerHTML=APPEARANCE_ICONS.map(item =\u003e {\n                const selected=activeIcon===item[0];\n                return '\u003cbutton type=\"button\" class=\"icon-choice '+(selected?'selected':'')+'\" aria-pressed=\"'+selected+'\" onclick=\"applyAppearanceIcon(\\''+item[0]+'\\')\"\u003e\u003cspan class=\"appearance-icon-art '+item[0]+'\"\u003e'+appearanceLogoSvg()+'\u003cspan class=\"appearance-icon-selected-check\"\u003e✓\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"icon-choice-name\"\u003e'+item[1]+'\u003c/span\u003e\u003c/button\u003e';\n            }).join('');\n        }\n\n        function switchView(viewId) {\n            document.querySelectorAll('.view-section').forEach(el =\u003e el.classList.add('hidden'));\n            document.getElementById(viewId).classList.remove('hidden');\n            lucide.createIcons();\n            refreshSummaries();\n        }\n\n        function refreshSummaries() {\n            document.getElementById('displayAccountInfo').innerText = `已配置 ${appData.accounts.length} 个账号`;\n            const totalFiles = appData.files.text?.length || 0;\n            document.getElementById('displayFileSummary').innerText = `共 ${totalFiles} 个文案模块`;\n            document.getElementById('displayLayoutSummary').innerText = `已保存 ${appData.layout.length} 个版式`;\n            document.getElementById('displayMoreSummary').innerText = `共 ${(appData.emoji?.length || 0) + (appData.history?.length || 0) + (appData.files.gif?.length || 0) + (appData.files.image?.length || 0)} 个数据模块`;\n        }\n\n        // --- 通用卡片列表渲染（账号 / 配图 / 文案 / 动图 / 版式 / 往期 / Emoji 共用） ---\n        const CARD_CLASS = 'bg-white p-4 rounded-xl shadow-sm flex items-center justify-between cursor-pointer hover:bg-gray-50 transition';\n\n        function escapeHtml(str) {\n            return String(str ?? '').replace(/[\u0026\u003c\u003e\"']/g, c =\u003e ({ '\u0026': '\u0026amp;', '\u003c': '\u0026lt;', '\u003e': '\u0026gt;', '\"': '\u0026quot;', \"'\": '\u0026#39;' }[c]));\n        }\n\n        function summarize(text, max = 60) {\n            const flat = String(text || '').replace(/\\s+/g, ' ').trim();\n            if (!flat) return '无内容';\n            return flat.length \u003e max ? flat.substring(0, max) + '…' : flat;\n        }\n\n        // rows: [{ name, summary, onclick }]  —— 每一项都是独立的一行圆角卡片：左名称+摘要，右箭头\n        function renderCardList(containerId, rows, emptyText) {\n            const container = document.getElementById(containerId);\n            container.innerHTML = rows.map(r =\u003e `\n                \u003cdiv class=\"${CARD_CLASS}\" onclick=\"${r.onclick}\"\u003e\n                    \u003cdiv class=\"flex-1 truncate\"\u003e\n                        \u003ch4 class=\"font-medium text-gray-900 text-sm\"\u003e${escapeHtml(r.name)}\u003c/h4\u003e\n                        \u003cp class=\"text-xs text-gray-400 truncate mt-1 font-mono\"\u003e${escapeHtml(r.summary)}\u003c/p\u003e\n                    \u003c/div\u003e\n                    \u003ci data-lucide=\"chevron-right\" class=\"w-4 h-4 text-gray-400 ml-3\"\u003e\u003c/i\u003e\n                \u003c/div\u003e\n            `).join('') || `\u003cp class=\"text-center text-gray-400 py-6\"\u003e${emptyText}\u003c/p\u003e`;\n            lucide.createIcons();\n        }\n\n        // --- 1. 账号模块逻辑 ---\n        document.getElementById('openAccount').addEventListener('click', () =\u003e {\n            renderAccountList();\n            switchView('accountView');\n        });\n\n        function renderAccountList() {\n            const container = document.getElementById('accountListContainer');\n            container.innerHTML = appData.accounts.map((acc, index) =\u003e `\n                \u003cdiv class=\"bg-white p-4 rounded-xl shadow-sm flex items-center justify-between cursor-pointer hover:bg-gray-50 transition\" onclick=\"openAccountEditModal(${index})\"\u003e\n                    \u003cdiv class=\"flex items-center gap-3\"\u003e\n                        \u003cimg src=\"${acc.avatar || 'https://via.placeholder.com/40'}\" class=\"w-10 h-10 rounded-full object-cover border\" alt=\"头像\"\u003e\n                        \u003cdiv\u003e\n                            \u003ch4 class=\"font-medium text-gray-900\"\u003e${escapeHtml(acc.name)}\u003c/h4\u003e\n                            \u003cp class=\"text-xs text-gray-400\"\u003eAppID: ${escapeHtml(acc.appId) || '未填'} | 作者: ${escapeHtml(acc.author) || '未填'}\u003c/p\u003e\n                        \u003c/div\u003e\n                    \u003c/div\u003e\n                    \u003ci data-lucide=\"chevron-right\" class=\"w-4 h-4 text-gray-400\"\u003e\u003c/i\u003e\n                \u003c/div\u003e\n            `).join('') || '\u003cp class=\"text-center text-gray-400 py-6\"\u003e暂无账号，请点击右上角新增\u003c/p\u003e';\n            lucide.createIcons();\n        }\n\n        function openAccountEditModal(index = -1) {\n            document.getElementById('editAccountIndex').value = index;\n            const delBtn = document.getElementById('accountDeleteBtn');\n            if (index \u003e -1) {\n                const acc = appData.accounts[index];\n                document.getElementById('accountModalTitle').innerText = '编辑账号';\n                document.getElementById('accAvatar').value = acc.avatar || '';\n                document.getElementById('accName').value = acc.name || '';\n                document.getElementById('accAppId').value = acc.appId || '';\n                document.getElementById('accSecret').value = acc.secret || '';\n                document.getElementById('accMpAvatar').value = acc.mpAvatar || '';\n                document.getElementById('accAuthor').value = acc.author || '';\n                delBtn.classList.remove('hidden');\n            } else {\n                document.getElementById('accountModalTitle').innerText = '新增账号';\n                document.getElementById('accAvatar').value = '';\n                document.getElementById('accName').value = '';\n                document.getElementById('accAppId').value = '';\n                document.getElementById('accSecret').value = '';\n                document.getElementById('accMpAvatar').value = '';\n                document.getElementById('accAuthor').value = '';\n                delBtn.classList.add('hidden');\n            }\n            document.getElementById('accountModal').classList.remove('hidden');\n        }\n\n        function closeAccountEditModal() {\n            document.getElementById('accountModal').classList.add('hidden');\n        }\n\n        function saveAccountItem() {\n            const index = parseInt(document.getElementById('editAccountIndex').value);\n            const dataObj = {\n                id: index \u003e -1 ? appData.accounts[index].id : Date.now(),\n                avatar: document.getElementById('accAvatar').value,\n                name: document.getElementById('accName').value || '未命名账号',\n                appId: document.getElementById('accAppId').value,\n                secret: document.getElementById('accSecret').value,\n                mpAvatar: document.getElementById('accMpAvatar').value,\n                author: document.getElementById('accAuthor').value\n            };\n            if (index \u003e -1) {\n                appData.accounts[index] = dataObj;\n            } else {\n                appData.accounts.push(dataObj);\n            }\n            saveData();\n            closeAccountEditModal();\n            renderAccountList();\n        }\n\n        function deleteAccount() {\n            const index = parseInt(document.getElementById('editAccountIndex').value);\n            if (index \u003e -1 \u0026\u0026 confirm('确定要删除该账号吗？')) {\n                appData.accounts.splice(index, 1);\n                saveData();\n                closeAccountEditModal();\n                renderAccountList();\n            }\n        }\n\n\n        // --- 2. 文件模块逻辑 ---\n        let currentFileTab = 'text'; // text（文案页）/ gif、image（更多页）\n\n        document.getElementById('openFileManage').addEventListener('click', () =\u003e {\n            currentFileTab = 'text';\n            setSortMode(false);\n            updateViewToggleBtn();\n            renderFileList();\n            switchView('fileView');\n        });\n\n        function renderFileList() {\n            const items = appData.files[currentFileTab] || [];\n            const rows = items.map((item, index) =\u003e ({\n                name: item.name,\n                summary: (currentFileTab === 'text' ? `【${item.category || '朋友圈'}】` : '') + summarize(item.content),\n                onclick: `openFileEditModal(${index})`\n            }));\n            if (currentFileTab === 'text') {\n                applyTextContainerMode();\n                if (sortMode \u0026\u0026 rows.length) { renderSortList(rows); return; }\n                if (textViewMode === 'grid' \u0026\u0026 rows.length) { renderTextGrid(rows); return; }\n                renderCardList('fileListContainer', rows, '暂无模块，请点击右上角新建');\n            } else {\n                renderCardList('moreListContainer', rows, '暂无模块，请点击右上角新建');\n            }\n        }\n\n        // --- 文案视图模式：宫格（4 列）/ 列表；选择会持久化，直到下次切换 ---\n        let textViewMode = 'list';\n        try { textViewMode = localStorage.getItem('my_text_view_mode') === 'grid' ? 'grid' : 'list'; } catch (e) {}\n        function updateViewToggleBtn() {\n            const b = document.getElementById('viewToggleBtn');\n            if (b) b.textContent = textViewMode === 'grid' ? '列表' : '宫格';   // 按钮显示“点击后切换到”的模式\n        }\n        function toggleViewMode() {\n            textViewMode = textViewMode === 'grid' ? 'list' : 'grid';\n            try { localStorage.setItem('my_text_view_mode', textViewMode); } catch (e) {}\n            renderFileList();\n        }\n        function applyTextContainerMode() {\n            const c = document.getElementById('fileListContainer');\n            const grid = textViewMode === 'grid';\n            c.className = grid ? '' : 'space-y-3';\n            c.style.cssText = grid ? 'display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;' : '';\n            updateViewToggleBtn();\n        }\n        function gridCellHtml(r, i, attrs) {\n            return `\u003cdiv ${attrs} class=\"bg-white rounded-xl shadow-sm cursor-pointer\" style=\"padding:10px 4px;text-align:center;min-width:0;min-height:64px;\" data-idx=\"${i}\"\u003e\n                \u003ch4 class=\"font-medium text-gray-900\" style=\"font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\"\u003e${escapeHtml(r.name)}\u003c/h4\u003e\n                \u003cp class=\"text-gray-400\" style=\"font-size:10px;margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;\"\u003e${escapeHtml(r.summary)}\u003c/p\u003e\n            \u003c/div\u003e`;\n        }\n        function renderTextGrid(rows) {\n            document.getElementById('fileListContainer').innerHTML = rows.map((r, i) =\u003e gridCellHtml(r, i, `onclick=\"${r.onclick}\"`)).join('');\n        }\n\n        // --- 文案手动排序（默认隐藏，点击【排序】开启；上下拖动 ≡ 调整顺序） ---\n        let sortMode = false;\n        function setSortMode(on) {\n            sortMode = !!on;\n            const btn = document.getElementById('sortToggleBtn');\n            btn.textContent = sortMode ? '完成' : '排序';\n            btn.className = sortMode\n                ? 'text-sm theme-fill px-3 py-1.5 rounded-lg cursor-pointer'\n                : 'text-sm bg-white border border-gray-200 text-gray-700 px-3 py-1.5 rounded-lg cursor-pointer';\n            document.getElementById('sortHint').classList.toggle('hidden', !sortMode);\n            document.getElementById('fileAddBtn').classList.toggle('hidden', sortMode);\n        }\n        function toggleSortMode() { setSortMode(!sortMode); renderFileList(); }\n\n        function renderSortList(rows) {\n            const c = document.getElementById('fileListContainer');\n            if (textViewMode === 'grid') {\n                c.innerHTML = rows.map((r, i) =\u003e gridCellHtml(r, i, 'data-handle=\"1\"').replace('class=\"bg-white', 'class=\"sort-row sort-handle-cell bg-white')).join('');\n                return;\n            }\n            c.innerHTML = rows.map((r, i) =\u003e `\n                \u003cdiv class=\"bg-white rounded-xl shadow-sm flex items-center justify-between sort-row\" data-idx=\"${i}\"\u003e\n                    \u003cdiv class=\"flex-1 truncate p-4 pr-2\"\u003e\n                        \u003ch4 class=\"font-medium text-gray-900 text-sm\"\u003e${escapeHtml(r.name)}\u003c/h4\u003e\n                        \u003cp class=\"text-xs text-gray-400 truncate mt-1 font-mono\"\u003e${escapeHtml(r.summary)}\u003c/p\u003e\n                    \u003c/div\u003e\n                    \u003cspan class=\"sort-handle\" data-handle=\"1\" title=\"按住拖动排序\"\u003e≡\u003c/span\u003e\n                \u003c/div\u003e`).join('');\n        }\n\n        (function initSortDrag() {\n            const c = document.getElementById('fileListContainer');\n            c.addEventListener('pointerdown', e =\u003e {\n                const handle = e.target.closest('[data-handle]');\n                if (!handle || !sortMode) return;\n                const row = handle.closest('.sort-row');\n                e.preventDefault();\n                handle.setPointerCapture(e.pointerId);\n                row.classList.add('sort-dragging');\n                const move = ev =\u003e {\n                    const x = ev.clientX, y = ev.clientY;\n                    if (y \u003c 70) window.scrollBy(0, -14); else if (y \u003e window.innerHeight - 70) window.scrollBy(0, 14);\n                    const rowsEl = Array.from(c.querySelectorAll('.sort-row'));\n                    const target = rowsEl.find(r =\u003e {\n                        if (r === row) return false;\n                        const bb = r.getBoundingClientRect();\n                        return x \u003e= bb.left \u0026\u0026 x \u003c= bb.right \u0026\u0026 y \u003e= bb.top \u0026\u0026 y \u003c= bb.bottom;\n                    });\n                    if (target) {\n                        const after = rowsEl.indexOf(target) \u003e rowsEl.indexOf(row);\n                        c.insertBefore(row, after ? target.nextSibling : target);\n                    }\n                };\n                const end = () =\u003e {\n                    handle.removeEventListener('pointermove', move);\n                    handle.removeEventListener('pointerup', end);\n                    handle.removeEventListener('pointercancel', end);\n                    row.classList.remove('sort-dragging');\n                    const order = Array.from(c.querySelectorAll('.sort-row')).map(el =\u003e Number(el.dataset.idx));\n                    const old = appData.files.text.slice();\n                    if (order.length === old.length \u0026\u0026 order.some((v, i) =\u003e v !== i)) {\n                        appData.files.text = order.map(i =\u003e old[i]);\n                        saveData();\n                    }\n                    renderFileList();\n                };\n                handle.addEventListener('pointermove', move);\n                handle.addEventListener('pointerup', end);\n                handle.addEventListener('pointercancel', end);\n            });\n        })();\n\n        function openFileEditModal(index = -1) {\n            document.getElementById('editFileIndex').value = index;\n            const titleFieldBox = document.getElementById('fileTitleFieldContainer');\n            const delBtn = document.getElementById('fileDeleteBtn');\n            \n            const categoryBox = document.getElementById('fileCategoryFieldContainer');\n            if (currentFileTab === 'text') {\n                titleFieldBox.classList.remove('hidden');\n                categoryBox.classList.remove('hidden');\n                document.getElementById('fileContentLabel').innerText = '内容字段 (每行一条，空行也可分隔)';\n            } else {\n                titleFieldBox.classList.add('hidden');\n                categoryBox.classList.add('hidden');\n                document.getElementById('fileContentLabel').innerText = '内容字段 (按两个换行符作为分隔)';\n            }\n\n            if (index \u003e -1) {\n                const item = appData.files[currentFileTab][index];\n                document.getElementById('fileModalTitle').innerText = '编辑文件模块';\n                document.getElementById('fileNameInput').value = item.name || '';\n                document.getElementById('fileTitleInput').value = item.title || '';\n                document.getElementById('fileContentInput').value = item.content || '';\n                document.getElementById('fileCategoryInput').value = TEXT_CATEGORIES.includes(item.category) ? item.category : '朋友圈';\n                delBtn.classList.remove('hidden');\n            } else {\n                document.getElementById('fileModalTitle').innerText = '新建文件模块';\n                document.getElementById('fileNameInput').value = '';\n                document.getElementById('fileTitleInput').value = '';\n                document.getElementById('fileContentInput').value = '';\n                document.getElementById('fileCategoryInput').value = '名句';\n                delBtn.classList.add('hidden');\n            }\n            document.getElementById('fileModal').classList.remove('hidden');\n        }\n\n        function closeFileEditModal() {\n            document.getElementById('fileModal').classList.add('hidden');\n        }\n\n        function saveFileItem() {\n            const index = parseInt(document.getElementById('editFileIndex').value);\n            const name = document.getElementById('fileNameInput').value || '未命名模块';\n            const title = document.getElementById('fileTitleInput').value || '';\n            const content = document.getElementById('fileContentInput').value || '';\n\n            const existing = index \u003e -1 ? appData.files[currentFileTab][index] : null;\n            const itemObj = Object.assign({}, existing || {}, { id: existing ? existing.id : 'f' + Date.now(), name, title, content });\n            if (currentFileTab === 'text') itemObj.category = document.getElementById('fileCategoryInput').value;\n            if (index \u003e -1) {\n                appData.files[currentFileTab][index] = itemObj;\n            } else {\n                appData.files[currentFileTab].push(itemObj);\n            }\n            saveData();\n            closeFileEditModal();\n            renderFileList();\n        }\n\n        function deleteFileItem() {\n            const index = parseInt(document.getElementById('editFileIndex').value);\n            if (index \u003e -1 \u0026\u0026 confirm('确定要删除该文件模块吗？')) {\n                appData.files[currentFileTab].splice(index, 1);\n                saveData();\n                closeFileEditModal();\n                renderFileList();\n            }\n        }\n\n\n        // --- 3, 4, 5. 版式 / 往期 / Emoji 的通用管理 ---\n        let currentGenericType = 'layout';\n        let currentGenericIndex = -1;\n\n        document.getElementById('openLayoutSettings').addEventListener('click', () =\u003e { openGenericList('layout'); });\n        document.getElementById('openMore').addEventListener('click', () =\u003e {\n            switchMoreTab('emoji');\n            switchView('moreView');\n        });\n\n        // 更多页：emoji / 往期 / 动图 三个标签（顺序固定）\n        const MORE_TAB_META = {\n            emoji:   { btn: 'moreTabBtnEmoji',   title: '已有 Emoji 列表',   add: '新增 Emoji' },\n            history: { btn: 'moreTabBtnHistory', title: '已有往期推荐列表', add: '新增往期' },\n            gif:     { btn: 'moreTabBtnGif',     title: '动图模块列表 (代码块)', add: '新建模块' },\n            image:   { btn: 'moreTabBtnImage',   title: '配图模块列表 (资源链接)', add: '新建模块' }\n        };\n        let currentMoreTab = 'emoji';\n\n        function viewFor(type) { return type === 'layout' ? 'layoutView' : 'moreView'; }\n\n        function switchMoreTab(tab) {\n            currentMoreTab = tab;\n            Object.keys(MORE_TAB_META).forEach(t =\u003e {\n                document.getElementById(MORE_TAB_META[t].btn).classList.toggle('active', t === tab);\n            });\n            document.getElementById('moreCurrentTitle').innerText = MORE_TAB_META[tab].title;\n            document.getElementById('moreAddLabel').innerText = MORE_TAB_META[tab].add;\n            if (tab === 'gif' || tab === 'image') {\n                currentFileTab = tab;\n                renderFileList();\n            } else {\n                currentGenericType = tab;\n                renderGenericList();\n            }\n        }\n\n        function openMoreAdd() {\n            if (currentMoreTab === 'gif' || currentMoreTab === 'image') { currentFileTab = currentMoreTab; openFileEditModal(); }\n            else openGenericEditModal(currentMoreTab);\n        }\n\n        function openGenericList(type) {\n            currentGenericType = type;\n            renderGenericList();\n            switchView(viewFor(type));\n        }\n\n        // ---- 往期条目：标题 / 链接 / 图片；有图片 → 图片版模板，无图片 → 文字版模板 ----\n        // ===== 往期：沿用原模板代码（文字版 / 图片版 / 置顶版），随机取 5 组「标题 / 链接 / 图片」按行一一对应替换 =====\n        function histLines(v) { return String(v == null ? '' : v).split(/\\r?\\n/).map(x =\u003e x.trim()).filter(Boolean); }\n        function histRows(item) {\n            const T = histLines(item.titles != null ? item.titles : item.title), L = histLines(item.links != null ? item.links : item.link), I = histLines(item.images != null ? item.images : item.image);\n            const rows = [];\n            for (let k = 0; k \u003c Math.min(T.length, L.length); k++) rows.push({ title: T[k], link: L[k], image: I[k] || '' });\n            return rows;\n        }\n        function histTemplate(item) {\n            const c = String(item.content || '');\n            if (/\u003ca\\b[^\u003e]*href/i.test(c) \u0026\u0026 !/table-layout:\\s*fixed/i.test(c)) return c;\n            const sd = ((SEED_DATA \u0026\u0026 SEED_DATA.history) || []).find(h =\u003e h.name === item.name);   // 模板被误改时，按名称还原原模板\n            return sd ? sd.content : c;\n        }\n        function histTitleLines(t) {\n            const parts = String(t).match(/[^，,、。！？!?；;：:]+[，,、。！？!?；;：:]?/g) || [String(t)];\n            const out = [];\n            parts.forEach(p =\u003e {\n                const c = Array.from(p), n = Math.ceil(c.length / 7), size = Math.ceil(c.length / n);\n                for (let i = 0; i \u003c c.length; i += size) out.push(c.slice(i, i + size).join(''));\n            });\n            return out;\n        }\n        function composeHistoryHtml(item) {\n            const tpl = histTemplate(item);\n            const box = document.createElement('div');\n            box.innerHTML = tpl;\n            const anchors = Array.from(box.querySelectorAll('a[href]'));\n            if (!anchors.length) return tpl;\n            const withImg = anchors.some(a =\u003e a.querySelector('img'));   // 文字版不使用图片；图片版 / 置顶版只取有图片的组\n            let rows = histRows(item);\n            if (withImg) rows = rows.filter(r =\u003e r.image);\n            if (!rows.length) return tpl;\n            const pool = rows.slice();\n            for (let i = pool.length - 1; i \u003e 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }\n            anchors.forEach((a, i) =\u003e {\n                const entry = a.parentElement, r = pool[i];\n                if (!r) { entry.remove(); return; }\n                a.setAttribute('href', r.link);\n                const img = a.querySelector('img');\n                if (!img) { a.textContent = r.title; return; }                       // 文字版\n                img.setAttribute('src', r.image);\n                if (img.hasAttribute('alt')) img.setAttribute('alt', r.title);\n                const p = entry.querySelector('p');\n                if (p) { p.textContent = r.title; return; }                            // 图片版\n                const ov = entry.querySelector('[class*=\"random-style\"]');             // 置顶版\n                if (!ov) return;\n                const cls = Array.from(ov.classList).find(c =\u003e /^random-style-/.test(c));\n                const vertical = /writing-mode/.test(ov.getAttribute('style') || '') || (cls \u0026\u0026 new RegExp('\\\\.' + cls + '\\\\s*\\\\{[^}]*writing-mode').test(tpl));\n                ov.textContent = '';\n                if (vertical) { ov.textContent = r.title; return; }\n                histTitleLines(r.title).forEach((ln, k) =\u003e { if (k) ov.appendChild(document.createElement('br')); ov.appendChild(document.createTextNode(ln)); });\n            });\n            return box.innerHTML;\n        }\n        function historyDraft() {\n            return { name: document.getElementById('genericNameInput').value, content: document.getElementById('genericContentInput').value,\n                titles: document.getElementById('genericTitlesInput').value, links: document.getElementById('genericLinkInput').value, images: document.getElementById('genericImageInput').value };\n        }\n        function configureGenericFields(type) {\n            const hist = type === 'history';\n            document.getElementById('genericNameLabel').innerText = '配置名称';\n            document.getElementById('genericNameInput').placeholder = hist ? '请输入往期配置名称' : '请输入名称';\n            document.getElementById('historyFieldsBox').classList.toggle('hidden', !hist);\n            if (!hist) { ['genericTitlesInput', 'genericLinkInput', 'genericImageInput'].forEach(id =\u003e { document.getElementById(id).value = ''; }); }\n        }\n        ['genericTitlesInput', 'genericLinkInput', 'genericImageInput'].forEach(id =\u003e {\n            document.getElementById(id).addEventListener('input', () =\u003e { if (currentGenericType === 'history') updateGenericPreview(document.getElementById('genericContentInput').value); });\n        });\n\n        function renderGenericList() {\n            const items = appData[currentGenericType] || [];\n            renderCardList(currentGenericType === 'layout' ? 'layoutListContainer' : 'moreListContainer', items.map((item, index) =\u003e ({\n                name: item.name,\n                summary: currentGenericType === 'history' ? ('共 ' + histRows(item).length + ' 条') : summarize(item.content),\n                onclick: `openGenericDetail(${index})`\n            })), '暂无数据，请点击右上角新增');\n        }\n\n        function openGenericEditModal(type) {\n            currentGenericType = type;\n            currentGenericIndex = -1;\n            document.getElementById('genericDetailTitle').innerText = '新增配置';\n            document.getElementById('genericNameInput').value = '';\n            document.getElementById('genericContentInput').value = '';\n            configureGenericFields(type);\n            \n            const titles = { layout: '版式管理', history: '更多', emoji: '更多' };\n            document.getElementById('genericBackLabel').innerText = titles[type];\n            document.getElementById('genericBackBtn').setAttribute('onclick', `switchView('${viewFor(type)}')`);\n            \n            updateGenericPreview('');\n            switchView('genericDetailView');\n        }\n\n        function openGenericDetail(index) {\n            currentGenericIndex = index;\n            const item = appData[currentGenericType][index];\n            document.getElementById('genericDetailTitle').innerText = '详情与编辑';\n            configureGenericFields(currentGenericType);\n            document.getElementById('genericNameInput').value = item.name;\n            document.getElementById('genericContentInput').value = currentGenericType === 'history' ? histTemplate(item) : item.content;\n            if (currentGenericType === 'history') {\n                document.getElementById('genericTitlesInput').value = item.titles != null ? item.titles : (item.title || '');\n                document.getElementById('genericLinkInput').value = item.links != null ? item.links : (item.link || '');\n                document.getElementById('genericImageInput').value = item.images != null ? item.images : (item.image || '');\n            }\n            \n            const titles = { layout: '版式管理', history: '更多', emoji: '更多' };\n            document.getElementById('genericBackLabel').innerText = titles[currentGenericType];\n            document.getElementById('genericBackBtn').setAttribute('onclick', `switchView('${viewFor(currentGenericType)}')`);\n            \n            updateGenericPreview(document.getElementById('genericContentInput').value);\n            switchView('genericDetailView');\n        }\n\n        document.getElementById('genericContentInput').addEventListener('input', (e) =\u003e {\n            updateGenericPreview(e.target.value);\n        });\n\n        function updateGenericPreview(content) {\n            const previewBox = document.getElementById('renderPreviewBox');\n            if (currentGenericType === 'history') {\n                previewBox.innerHTML = (content \u0026\u0026 content.trim() ? composeHistoryHtml(historyDraft()) : '') || '\u003cspan class=\"text-gray-400\"\u003e暂无预览内容...\u003c/span\u003e';\n            } else if (currentGenericType === 'emoji') {\n                previewBox.innerHTML = `\u003cdiv class=\"text-xl tracking-wider\"\u003e${content}\u003c/div\u003e`;\n            } else {\n                previewBox.innerHTML = content || '\u003cspan class=\"text-gray-400\"\u003e暂无预览内容...\u003c/span\u003e';\n            }\n            lucide.createIcons();\n        }\n\n        function saveGenericItem() {\n            let name = document.getElementById('genericNameInput').value || '未命名配置';\n            let content = document.getElementById('genericContentInput').value;\n            let extra = {};\n            if (currentGenericType === 'history') {   // 存储标题 / 链接 / 图片三组多行文本；content 仍为原模板代码，排版时再随机取 5 组套入\n                const titles = document.getElementById('genericTitlesInput').value, links = document.getElementById('genericLinkInput').value, images = document.getElementById('genericImageInput').value;\n                extra = { titles, links, images };\n            }\n\n            const existing = currentGenericIndex \u003e -1 ? appData[currentGenericType][currentGenericIndex] : null;\n            const itemObj = Object.assign({}, existing || {}, { id: existing ? existing.id : Date.now(), name, content }, extra);\n            if (currentGenericIndex \u003e -1) {\n                appData[currentGenericType][currentGenericIndex] = itemObj;\n            } else {\n                appData[currentGenericType].push(itemObj);\n            }\n            saveData();\n            switchView(viewFor(currentGenericType));\n            renderGenericList();\n        }\n\n        function deleteCurrentGenericItem() {\n            if (currentGenericIndex \u003c 0) {\n                switchView(viewFor(currentGenericType));\n                return;\n            }\n            if (confirm('确定要删除该项配置吗？')) {\n                appData[currentGenericType].splice(currentGenericIndex, 1);\n                saveData();\n                switchView(viewFor(currentGenericType));\n                renderGenericList();\n            }\n        }\n\n        function copyPreviewContent() {\n            const content = document.getElementById('genericContentInput').value;\n            navigator.clipboard.writeText(content).then(() =\u003e {\n                alert('内容已成功复制到剪贴板！');\n            }).catch(() =\u003e {\n                alert('复制失败');\n            });\n        }\n\n\n        // --- 6. 备份与恢复功能逻辑 ---\n        document.getElementById('openBackupView').addEventListener('click', () =\u003e {\n            switchView('backupView');\n        });\n\n        function exportAllData() {\n            const dataStr = \"data:text/json;charset=utf-8,\" + encodeURIComponent(JSON.stringify(appData, null, 2));\n            const downloadAnchor = document.createElement('a');\n            downloadAnchor.setAttribute(\"href\", dataStr);\n            downloadAnchor.setAttribute(\"download\", `my_admin_backup_${new Date().toISOString().slice(0,10)}.json`);\n            document.body.appendChild(downloadAnchor);\n            downloadAnchor.click();\n            downloadAnchor.remove();\n        }\n\n        function importAllData(event) {\n            const file = event.target.files[0];\n            if (!file) return;\n            const reader = new FileReader();\n            reader.onload = function(e) {\n                try {\n                    const imported = JSON.parse(e.target.result);\n                    if (imported \u0026\u0026 Array.isArray(imported.accounts) \u0026\u0026 imported.files) {\n                        appData = normalizeData(imported);\n                        saveData();\n                        try { localStorage.setItem(SEED_FLAG_KEY, SEED_ID); } catch (err) {}\n                        alert('备份恢复成功！全部设置项已精准写入对应配置。');\n                        switchView('myView');\n                    } else {\n                        alert('备份文件格式不正确，导入失败。');\n                    }\n                } catch (err) {\n                    alert('解析备份文件出错：' + err.message);\n                }\n            };\n            reader.readAsText(file);\n        }\n\n        document.getElementById('openAppearanceSettings').addEventListener('click', () =\u003e { renderAppearanceSettings(); switchView('settingsView'); });\n\n        // 初始化\n        lucide.createIcons();\n        refreshSummaries();\n\n        document.getElementById('backBtn').addEventListener('click', () =\u003e {\n            if (window.parent !== window \u0026\u0026 parent.showView) parent.showView('layout');\n            else location.href = LAYOUT_PAGE_URL;\n        });\n    \u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"}</script>
<script>
  // 同一文件内的两个页面（排版 / 我的）共用同一份 localStorage 数据，通过 showView 相互切换
  var PAGES = JSON.parse(document.getElementById('pagesData').textContent);
  var fL = document.getElementById('frameLayout'), fM = document.getElementById('frameMy');
  fL.srcdoc = PAGES.layout;
  fM.srcdoc = PAGES.my;
  function showView(v) {
    fL.classList.toggle('on', v === 'layout');
    fM.classList.toggle('on', v === 'my');
    if (v === 'layout') { try { fL.contentWindow.refreshFromStorage(); } catch (e) {} }
    try { sessionStorage.setItem('app_view', v); } catch (e) {}
  }
  showView('layout');
</script>
